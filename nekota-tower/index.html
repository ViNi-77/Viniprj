<style>
/* src/css/screen.css */
/* 画面の土台：黒背景に 4:3 の内部解像度 320×240 を整数倍で中央表示 */
:root {
  --scale: 2;           /* 07_screen.js が更新（CSS px あたりの倍率。デバイスピクセル基準では小数になる） */
  --stage-w: 640px;
  --stage-h: 480px;
  --ink: #f4f1e8;
  --paper: #000;
}
html, body {
  margin: 0; padding: 0; height: 100%; background: #000; color: var(--ink);
  font-family: "PM12", "MS Gothic", "Yu Gothic", "Hiragino Kaku Gothic ProN", monospace;
  overflow: hidden;
}
body { display: flex; align-items: center; justify-content: center; }
#stage {
  position: relative;
  width: var(--stage-w); height: var(--stage-h);
  background: #000;
}
#game {
  display: block; width: 100%; height: 100%;
  image-rendering: pixelated; image-rendering: crisp-edges;
  outline: none; background: #000;
}
#game:focus-visible { box-shadow: 0 0 0 2px rgba(244, 208, 63, .6); }
#banner {
  position: fixed; left: 0; right: 0; top: 0; z-index: 50;
  background: #4a1414; color: #fff; font-size: 14px; padding: 6px 12px; display: none;
}
#banner.show { display: block; }
.hidden { display: none !important; }
/* src/css/crt.css */
/* ブラウン管風オーバーレイ。走査線の周期は倍率に合わせ、文字が潰れない薄さに留める */
#crt {
  position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background:
    radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.35) 100%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0, rgba(0,0,0,.22) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) calc(var(--scale) * 1px));
  opacity: 1;
}
#crt::after {
  /* 電源投入の走る帯。reduced-motion では止める */
  content: ""; position: absolute; left: 0; right: 0; height: 12%;
  background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.035) 50%, rgba(255,255,255,0) 100%);
  animation: crtBand 7s linear infinite;
}
@keyframes crtBand { from { top: -12%; } to { top: 100%; } }
#crt.off { display: none; }
@media (prefers-reduced-motion: reduce) {
  #crt::after { animation: none; display: none; }
}
/* src/css/overlay.css */
/* DOM オーバーレイ：日本語入力欄（IME対応のため実 input を使う）、ファイル読込、ドロップ受け */
#overlay { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#overlay > * { pointer-events: auto; }
.nt-input, .nt-textarea {
  position: absolute; box-sizing: border-box;
  background: #000; color: #f4f1e8; border: 0; outline: none; margin: 0; padding: 0;
  font-family: "PM12", "MS Gothic", "Yu Gothic", monospace;
  font-size: calc(var(--scale) * 12px); line-height: calc(var(--scale) * 16px);
  caret-color: #f4d03f; border-radius: 0; resize: none; overflow: hidden;
  -webkit-font-smoothing: none; font-smooth: never;
}
.nt-input::placeholder, .nt-textarea::placeholder { color: #5b5a66; }
.nt-input:focus, .nt-textarea:focus { box-shadow: 0 0 0 calc(var(--scale) * 1px) #f4d03f; }
#filepick { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
#dropzone {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,.72); color: #f4f1e8; font-size: calc(var(--scale) * 12px);
  border: calc(var(--scale) * 2px) dashed #f4d03f; box-sizing: border-box;
}
#dropzone.show { display: flex; }
</style>
</head>

<script>
//# sourceURL=src/data/dialogs.js
/* 会話スクリプト。形式は 20_dialog.js 冒頭を参照。{name} はプレイヤー名、{daysLeft} は残り日数 */

<script>
//# sourceURL=src/data/map.js
/* 年末の塔のマップ。40列×130行。1階＝13行（上壁1・床11・下壁1）。10Fが最上段、1Fが最下段。
   凡例: # 壁  = 壁の上面  . 床  , 絨毯  S 下り階段  s 上り階段  E エレベーター扉  | 縦坑
         M 石碑(きろく)  D 扉(閉)  d 扉(開)  B 本棚  W 窓  F 花の鉢  @ 開始位置  x NPCの立ち位置(床と同じ) */
(function () {
  "use strict";
  var NT = window.NT = window.NT || {}; NT.DATA = NT.DATA || {};
  var COLS = 40, FLOOR_ROWS = 13, FLOORS = 10;

  /* 階ごとの配色 [暗, 中, 明, 最明]。10F の寒色から 1F の暖色へ */
  var PALETTES = {
    10: ["#0b1a2e", "#1f3b57", "#5c8bb0", "#dbe9f5"],
    9: ["#0f1f33", "#24455f", "#6a95b3", "#dfeaf2"],
    8: ["#14213a", "#2d4a66", "#7a9fba", "#e3ecf2"],
    7: ["#1a2338", "#3a4f68", "#8aa5b8", "#e6edf1"],
    6: ["#1f2434", "#474f63", "#9aa6b2", "#eaeeef"],
    5: ["#262430", "#54505f", "#a9a6ac", "#eeecec"],
    4: ["#2c2429", "#60505a", "#b8a39f", "#f1ebe6"],
    3: ["#30231f", "#6c4f43", "#c6a28a", "#f5ecdf"],
    2: ["#331f14", "#754a2a", "#d19a66", "#f8eed8"],
    1: ["#2e1a0b", "#6e3b1f", "#d08a4f", "#fff1dc"]
  };

  /* 階ごとの配置。stair: 下り階段の列（右 36 か 左 5）。stone: 石碑の座標。pots: 花の鉢。shelves/windows: 上壁の飾り */
  var FLOORS_CFG = {
    10: { stair: 36, stone: [8, 4], pots: [[12, 3], [26, 3], [30, 9]], shelves: [14, 15, 16], windows: [22, 28] },
    9: { stair: 5, stone: [31, 4], pots: [[10, 9], [20, 3], [33, 9]], shelves: [8, 9], windows: [18, 24, 30] },
    8: { stair: 36, stone: [8, 9], pots: [[14, 3], [24, 9], [30, 4]], shelves: [26, 27, 28], windows: [10, 16] },
    7: { stair: 5, stone: [31, 9], pots: [[10, 3], [19, 9], [27, 3]], shelves: [12, 13], windows: [20, 26, 32] },
    6: { stair: 36, stone: [8, 4], pots: [[16, 9], [22, 3], [30, 9]], shelves: [24, 25, 26, 27], windows: [12, 18] },
    5: { stair: 5, stone: [31, 4], pots: [[9, 9], [18, 3], [28, 9]], shelves: [10, 11, 12], windows: [20, 26] },
    4: { stair: 36, stone: [8, 9], pots: [[13, 3], [21, 9], [29, 3]], shelves: [30, 31], windows: [12, 18, 24] },
    3: { stair: 5, stone: [31, 9], pots: [[11, 3], [19, 3], [27, 9]], shelves: [14, 15], windows: [22, 28, 34] },
    2: { stair: 36, stone: [8, 4], pots: [[15, 9], [23, 3], [31, 9]], shelves: [10, 11, 26, 27], windows: [18] },
    1: { stair: null, stone: [8, 4], pots: [[12, 3], [28, 3]], shelves: [], windows: [14, 20, 26] }
  };

  function buildRows() {
    var rows = [];
    for (var f = FLOORS; f >= 1; f--) {
      var cfg = FLOORS_CFG[f];
      var band = [];
      for (var r = 0; r < FLOOR_ROWS; r++) {
        var line = [];
        for (var c = 0; c < COLS; c++) {
          var ch = ".";
          if (r === 0 || r === FLOOR_ROWS - 1) ch = "#";
          else if (c === 0 || c === COLS - 1) ch = "#";
          else if (c === 1) ch = "|";
          if (r === 1 && c > 1 && c < COLS - 1) ch = "=";
          line.push(ch);
        }
        band.push(line);
      }
      /* エレベーター扉（x=2, 中段） */
      band[6][2] = "E";
      /* 上壁の飾り */
      cfg.shelves.forEach(function (x) { band[1][x] = "B"; });
      cfg.windows.forEach(function (x) { band[1][x] = "W"; });
      /* 石碑と鉢 */
      band[cfg.stone[1]][cfg.stone[0]] = "M";
      cfg.pots.forEach(function (p) { band[p[1]][p[0]] = "F"; });
      /* 絨毯（中央の通路） */
      for (var cc = 17; cc <= 22; cc++) for (var rr = 3; rr <= 10; rr++) if (band[rr][cc] === ".") band[rr][cc] = ",";
      /* 下り階段：この階の下壁を抜けて次の階へ */
      if (cfg.stair !== null) {
        var sx = cfg.stair;
        band[11][sx] = "S"; band[11][sx + 1] = "S";
        band[12][sx] = "S"; band[12][sx + 1] = "S";
      }
      /* 上り階段：上の階から降りてきた位置 */
      if (f < FLOORS) {
        var ux = FLOORS_CFG[f + 1].stair;
        band[0][ux] = "s"; band[0][ux + 1] = "s";
        band[1][ux] = "s"; band[1][ux + 1] = "s";
        band[2][ux] = "s"; band[2][ux + 1] = "s";
      }
      /* 1F：奥の部屋と扉 */
      if (f === 1) {
        for (var dx = 1; dx < COLS - 1; dx++) if (band[8][dx] !== "|") band[8][dx] = "#";
        band[8][20] = "D";
        for (var ry = 9; ry <= 11; ry++) for (var rx = 2; rx < COLS - 1; rx++) if (band[ry][rx] !== "|") band[ry][rx] = ",";
      }
      /* 10F：開始位置 */
      if (f === FLOORS) band[5][20] = "@";
      band.forEach(function (l) { rows.push(l.join("")); });
    }
    return rows;
  }

  NT.DATA.MAP = {
    cols: COLS, floorRows: FLOOR_ROWS, floors: FLOORS,
    rows: buildRows(),
    palettes: PALETTES,
    cfg: FLOORS_CFG,
    /* 階 f の帯の先頭行 */
    bandY: function (f) { return (FLOORS - f) * FLOOR_ROWS; },
    floorAt: function (y) { var f = FLOORS - Math.floor(y / FLOOR_ROWS); return Math.max(1, Math.min(FLOORS, f)); },
    /* エレベーターで降り立つ位置（扉の右隣） */
    elevatorSpot: function (f) { return { x: 3, y: (FLOORS - f) * FLOOR_ROWS + 6 }; }
  };
})();
</script>

<script>
//# sourceURL=src/svg/nekota.js
/* ねこ太の SVG 文字列（ロジックなし）。32x40、足元中心が (0,0)、上が y 負 */
(function () {
  "use strict";
  var NT = window.NT = window.NT || {};
  NT.SVG = NT.SVG || {};

  var BODY = "#CDBDEC", PAW = "#B6A3DE", PINK = "#F4AFC4", BAND = "#F4D03F", STRIPE = "#D9AE22";
  var EYE = "#3A3A45", MOUTH = "#6B4A3A", WHISKER = "#8E7FB5", SALMON = "#F47A4B";

  // 影（原作 L1(8)）。揺れグループの外に置く
  var SHADOW = '<ellipse cx="0" cy="0" rx="8" ry="2.7" fill="rgba(40,55,40,.2)"/>';

  // 胴（しっぽ無し）＋前掛け。しっぽは向きごとに付ける
  var TORSO = '<ellipse cx="0" cy="-6.8" rx="6.8" ry="6.8" fill="' + BODY + '"/>' +
    '<path d="M-4.8 -8.8H4.8V-3.2Q0 -1.2 -4.8 -3.2Z" fill="#FFFDF6" stroke="#E7E0D0" stroke-width="0.4"/>' +
    '<path d="M-1.4 -8.6q1.4 1.4 2.8 0M0 -7.8l-0.9 1.8M0 -7.8l0.9 1.8" stroke="#E0D8C6" stroke-width="0.5" fill="none"/>';
  var TORSO_BACK = '<ellipse cx="0" cy="-6.8" rx="6.8" ry="6.8" fill="' + BODY + '"/>' +
    '<path d="M-4.4 -9.2Q0 -8.2 4.4 -9.2" stroke="#FFFDF6" stroke-width="0.9" fill="none" stroke-linecap="round"/>';

  // しっぽ：右側に出る版（原作）。左側は mirror で作る
  var TAIL_R = '<path d="M5.2 -4.4C10.5 -3.6 12.6 -8.6 10 -10.6" stroke="' + BODY + '" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
  var TAIL_L = '<path d="M-5.2 -4.4C-10.5 -3.6 -12.6 -8.6 -10 -10.6" stroke="' + BODY + '" stroke-width="2.4" fill="none" stroke-linecap="round"/>';

  var HEAD = '<ellipse cx="0" cy="-16.4" rx="10.2" ry="8.4" fill="' + BODY + '"/>';

  // 耳（外側）。dx で片耳を少し後ろへ（3/4 向き用）
  function ears(inner, lx, rx) {
    lx = lx || 0; rx = rx || 0;
    var s = '<path d="M' + (-9.4 + lx) + ' -19L' + (-7.6 + lx) + ' -27.4L' + (-2.6 + lx) + ' -23Z" fill="' + BODY + '"/>' +
      '<path d="M' + (9.4 + rx) + ' -19L' + (7.6 + rx) + ' -27.4L' + (2.6 + rx) + ' -23Z" fill="' + BODY + '"/>';
    if (inner) {
      s += '<path d="M' + (-7.8 + lx) + ' -21.4L' + (-7.1 + lx) + ' -25.3L' + (-4.3 + lx) + ' -23Z" fill="' + PINK + '"/>' +
        '<path d="M' + (7.8 + rx) + ' -21.4L' + (7.1 + rx) + ' -25.3L' + (4.3 + rx) + ' -23Z" fill="' + PINK + '"/>';
    }
    return s;
  }

  // はちまき（帯＋縞）。結び目は向きごとに
  var BAND_BASE = '<path d="M-9.9 -20.6Q0 -24.2 9.9 -20.6L9.6 -18.4Q0 -21.8 -9.6 -18.4Z" fill="' + BAND + '"/>' +
    '<path d="M-7.5 -21.9l1.2 2M-4.5 -22.8l1.2 2M-1.5 -23.2l1.2 2M1.5 -23.2l1.2 2M4.5 -22.8l1.2 2M7.2 -21.9l1.1 2" stroke="' + STRIPE + '" stroke-width="0.7" stroke-linecap="round"/>';
  var KNOT_R = '<path d="M8.4 -21L13.4 -24.6L12.2 -19.8ZM8.6 -20.4L13.6 -18L10.4 -17.2Z" fill="' + BAND + '"/>' +
    '<circle cx="9.2" cy="-20.2" r="1.3" fill="' + STRIPE + '"/>';
  // 後ろ姿：結び目が頭の真ん中、垂れが左右下へ
  var KNOT_BACK = '<path d="M-0.6 -19.8L-4.6 -16.2L-1.4 -15.4ZM0.6 -19.8L4.6 -16.2L1.4 -15.4Z" fill="' + BAND + '"/>' +
    '<path d="M-3.4 -17.6l0.9 0.9M3.4 -17.6l-0.9 0.9" stroke="' + STRIPE + '" stroke-width="0.6" stroke-linecap="round"/>' +
    '<circle cx="0" cy="-20.2" r="1.4" fill="' + STRIPE + '"/>';

  // 顔（目・口・ほっぺ・ひげ）
  var FACE = '<ellipse cx="-3.9" cy="-15.8" rx="1.7" ry="2.1" fill="' + EYE + '"/><ellipse cx="3.9" cy="-15.8" rx="1.7" ry="2.1" fill="' + EYE + '"/>' +
    '<circle cx="-3.4" cy="-16.4" r="0.55" fill="#fff"/><circle cx="4.4" cy="-16.4" r="0.55" fill="#fff"/>' +
    '<path d="M-6.1 -17.9L-1.9 -17.3M1.9 -17.3L6.1 -17.9" stroke="' + EYE + '" stroke-width="1.1" stroke-linecap="round"/>' +
    '<path d="M-1.5 -13.1q0.75 0.9 1.5 0q0.75 0.9 1.5 0" stroke="' + MOUTH + '" stroke-width="0.7" fill="none" stroke-linecap="round"/>' +
    '<ellipse cx="-6.8" cy="-13.4" rx="1.8" ry="1" fill="' + PINK + '" opacity=".85"/><ellipse cx="6.8" cy="-13.4" rx="1.8" ry="1" fill="' + PINK + '" opacity=".85"/>';
  var WHISKERS = '<path d="M-10.6 -14.6h2.2M-10.4 -13.2h2M10.6 -14.6h-2.2M10.4 -13.2h-2" stroke="' + WHISKER + '" stroke-width="0.45" stroke-linecap="round"/>';
  // 3/4 向き：遠い側のひげは短く
  var WHISKERS_R = '<path d="M-9.2 -14.6h1.6M-9 -13.2h1.4M10.6 -14.6h-2.2M10.4 -13.2h-2" stroke="' + WHISKER + '" stroke-width="0.45" stroke-linecap="round"/>';

  // おすし＋両手。dx で手前にずらす
  function sushi(on, dx) {
    dx = dx || 0;
    if (!on) return '';
    return '<g transform="translate(' + (-0.5 + dx) + ' -9.6) rotate(-12)">' +
      '<ellipse cx="0" cy="0.6" rx="4.2" ry="1.9" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="0.3"/>' +
      '<path d="M-4.6 -0.4Q0 -3.8 4.8 -0.8Q0 -0.2 -4.6 -0.4Z" fill="' + SALMON + '"/>' +
      '<path d="M-2.4 -1.4l0.9 0.9M-0.4 -2.1l0.8 1.1M1.6 -2l0.7 1.1" stroke="#FFD2BF" stroke-width="0.45"/></g>' +
      '<ellipse cx="' + (-4.6 + dx) + '" cy="-8.8" rx="1.8" ry="1.5" fill="' + BODY + '"/>' +
      '<ellipse cx="' + (4.2 + dx) + '" cy="-9.4" rx="1.8" ry="1.5" fill="' + BODY + '"/>';
  }
  // 手を振る（上げた前足）
  var WAVE = '<ellipse cx="-8.4" cy="-12.6" rx="1.8" ry="2.6" fill="' + BODY + '" transform="rotate(-24 -8.4 -12.6)"/>';

  // 足。frame で左右交互に ±0.6 ずらして一歩を示す
  function feet(frame) {
    var d = 0.6 * frame;
    return '<ellipse cx="-3" cy="' + (-0.9 + d).toFixed(1) + '" rx="2.6" ry="1.5" fill="' + PAW + '"/>' +
      '<ellipse cx="3" cy="' + (-0.9 - d).toFixed(1) + '" rx="2.6" ry="1.5" fill="' + PAW + '"/>';
  }

  function down(frame, o) {
    return TAIL_R + TORSO + feet(frame) + (o.wave ? WAVE : '') + ears(true) + HEAD + BAND_BASE + KNOT_R + FACE + WHISKERS + sushi(o.sushi, 0);
  }
  function up(frame) {
    // 後ろ姿：顔・ひげ・おすし無し。しっぽは左側へ巻き上がる
    return TAIL_L + TORSO_BACK + feet(frame) + ears(false) + HEAD + BAND_BASE + KNOT_BACK;
  }
  function right(frame, o) {
    // 3/4 向き：顔を +2 へ、左耳を少し中央寄り（後ろ）に、しっぽは遠い側（左）
    var face = '<g transform="translate(2 0)">' + FACE + WHISKERS_R + '</g>';
    return TAIL_L + TORSO + feet(frame) + (o.wave ? WAVE : '') + ears(true, 1.2, 0) + HEAD + BAND_BASE + KNOT_R + face + sushi(o.sushi, 1);
  }

  /**
   * @param {string} dir 'down'|'up'|'left'|'right'
   * @param {number} frame -1|0|1（揺れ。±3.5°）
   * @param {{sushi?:boolean, wave?:boolean}} opts
   * @returns {string} 完全な SVG 文字列（32x40、viewBox -16 -36 32 40）
   */
  NT.SVG.nekota = function (dir, frame, opts) {
    var o = opts || {};
    var s = o.sushi !== false;
    var f = frame > 0 ? 1 : frame < 0 ? -1 : 0;
    var body;
    if (dir === 'up') body = up(f);
    else if (dir === 'right') body = right(f, { sushi: s, wave: !!o.wave });
    else if (dir === 'left') body = '<g transform="scale(-1,1)">' + right(f, { sushi: s, wave: !!o.wave }) + '</g>';
    else body = down(f, { sushi: s, wave: !!o.wave });
    var rot = f * 3.5;
    return '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="-16 -36 32 40">' +
      SHADOW + '<g transform="rotate(' + rot + ')">' + body + '</g></svg>';
  };
})();
</script>
<script>
//# sourceURL=src/svg/npcs.js
/* NPC の SVG 文字列（ロジックなし）。32x40、足元中心が (0,0)、上が y 負。ねこ太と同じ丸い雰囲気 */
(function () {
  "use strict";
  var NT = window.NT = window.NT || {};
  NT.SVG = NT.SVG || {};

  var EYE = "#3A3A45";
  var SHADOW = '<ellipse cx="0" cy="0" rx="8" ry="2.7" fill="rgba(40,55,40,.2)"/>';

  function wrap(inner) {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="-16 -36 32 40">' + SHADOW + inner + '</svg>';
  }
  // 丸い体＋頭＋足（共通シルエット）
  function base(body, feet, headY, headR) {

  NT.FONT_HEAD = '"DG16","PM12","MS Gothic","Yu Gothic",monospace';
  NT.debug = /[?&]debug=1/.test(location.search);
  NT.query = {};
  location.search.replace(/^\?/, "").split("&").forEach(function (kv) {
    if (!kv) return;

    var k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i));

    NT.query[k] = v;
  });
})();

/* 小さな共通関数 */
(function () {
  "use strict";
  var NT = window.NT;
  var U = NT.Util = {};

  U.clamp = function (v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; };
  U.lerp = function (a, b, t) { return a + (b - a) * t; };
  U.easeInOut = function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
  U.easeOut = function (t) { return 1 - (1 - t) * (1 - t); };
  U.sign = function (v) { return v > 0 ? 1 : v < 0 ? -1 : 0; };
  U.pad2 = function (n) { return (n < 10 ? "0" : "") + n; };

  /* 乱数（再現性のため種あり。演出用途のみ） */
  U.rng = function (seed) {
    var s = (seed >>> 0) || 0x9e3779b9;
    return function () {
      s += 0x6D2B79F5; s >>>= 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  U.deepClone = function (o) { return JSON.parse(JSON.stringify(o)); };
  U.assign = function (dst, src) { for (var k in src) if (Object.prototype.hasOwnProperty.call(src, k)) dst[k] = src[k]; return dst; };

  /* 文字数（書記素）。Intl.Segmenter が無ければコードポイント数 */
  var seg = (typeof Intl !== "undefined" && Intl.Segmenter) ? new Intl.Segmenter("ja", { granularity: "grapheme" }) : null;
  U.graphemes = function (s) {
    if (!s) return [];
    if (seg) { var out = []; for (var g of seg.segment(s)) out.push(g.segment); return out; }
    return Array.from(s);
  };
  U.gLen = function (s) { return U.graphemes(s).length; };
  U.gSlice = function (s, n) { return U.graphemes(s).slice(0, n).join(""); };

  /* 文字列テンプレート {key} 置換 */
  U.fmt = function (s, vars) {
    if (!vars) return s;
    return String(s).replace(/\{(\w+)\}/g, function (m, k) { return (k in vars) ? String(vars[k]) : m; });
  };

  U.uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };

  U.escapeHtml = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  };
})();

/* 実時間。日付キーは常に日本時間。Date.now をラップしてテストで差し替えられるようにする */
(function () {
  "use strict";
  var NT = window.NT;
  var T = NT.Time = {};
  var fmt = null;
  try {
    fmt = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  } catch (e) { fmt = null; }

  T.now = function () { return Date.now(); };

  /* 'YYYY-MM-DD'（JST）*/
  T.jstKey = function (ms) {
    if (ms === undefined) ms = T.now();
    if (fmt) {
      var p = {};
      fmt.formatToParts(new Date(ms)).forEach(function (x) { p[x.type] = x.value; });
      return p.year + "-" + p.month + "-" + p.day;
    }
    return new Date(ms + 9 * 3600 * 1000).toISOString().slice(0, 10);
  };
  /* JST の時:分 */
  T.jstHM = function (ms) {
    if (ms === undefined) ms = T.now();
    if (fmt) {
      var p = {};
      fmt.formatToParts(new Date(ms)).forEach(function (x) { p[x.type] = x.value; });
      return (p.hour === "24" ? "00" : p.hour) + ":" + p.minute;
    }
    var d = new Date(ms + 9 * 3600 * 1000);
    return NT.Util.pad2(d.getUTCHours()) + ":" + NT.Util.pad2(d.getUTCMinutes());
  };
  T.keyToUTC = function (key) { var a = key.split("-"); return Date.UTC(+a[0], +a[1] - 1, +a[2]); };
  T.nextKey = function (key) { return new Date(T.keyToUTC(key) + 86400000).toISOString().slice(0, 10); };
  T.prevKey = function (key) { return new Date(T.keyToUTC(key) - 86400000).toISOString().slice(0, 10); };
  T.diffDays = function (a, b) { return Math.round((T.keyToUTC(b) - T.keyToUTC(a)) / 86400000); };
  T.yearOf = function (key) { return +key.slice(0, 4); };
  T.mmdd = function (key) { return key.slice(5); };

  /* 局面。prep: 〜11/30 ×1, dec: 12/1〜27 ×2, final: 12/28〜31 ×7, over: 年が明けた */
  T.phase = function (key, year) {
    key = key || T.jstKey();
    year = year || T.yearOf(key);
    if (T.yearOf(key) > year) return "over";
    var md = T.mmdd(key);
    if (md < "12-01") return "prep";
    if (md < "12-28") return "dec";
    return "final";
  };
  T.mult = function (phase) { return { prep: 1, dec: 2, final: 7, over: 0 }[phase] || 1; };
  /* 12/31 までの残り日数（当日を含む）*/
  T.daysLeft = function (key, year) {
    key = key || T.jstKey();
    year = year || T.yearOf(key);
    var end = year + "-12-31";
    return Math.max(0, T.diffDays(key, end) + 1);
  };
  /* 体感残り日数（演出用の換算）*/
  T.feelDays = function (key, year) {
    key = key || T.jstKey();
    year = year || T.yearOf(key);
    var total = 0, k = key, end = year + "-12-31";
    var guard = 0;
    while (k <= end && guard++ < 400) { total += T.mult(T.phase(k, year)); k = T.nextKey(k); }
    return total;
  };
  /* 時計の疑い：保存時刻が未来、または最後に見た日付より過去 */
  T.clockSuspect = function (rec) {
    if (!rec) return false;
    var now = T.now();
    if (rec.savedAt && (new Date(rec.savedAt).getTime() - now) > 10 * 60 * 1000) return true;
    if (rec.state && rec.state.lastKey && T.jstKey(now) < rec.state.lastKey) return true;
    return false;
  };
  /* 日本の年末暦（演出用）*/
  T.calendarNote = function (key) {
    var md = T.mmdd(key || T.jstKey());
    var notes = NT.DATA.CALENDAR_NOTES || {};
    return notes[md] || null;
  };
})();

/* 本体メモリ（localStorage）。file:// ではブラウザごとに挙動が違うので、失敗したらメモリ内に退避して告知する */
(function () {
  "use strict";
  var NT = window.NT;
  var S = NT.Storage = {};
  var PREFIX = NT.APP + ":v1:";
  var mem = {};
  S.available = false;
  S.reason = "";

  function key(k) { return PREFIX + k; }

  S.probe = function () {
    try {
      var k = key("probe"), v = String(Date.now());
      localStorage.setItem(k, v);
      var ok = localStorage.getItem(k) === v;
      localStorage.removeItem(k);
      S.available = ok;
      if (!ok) S.reason = "readback";
    } catch (e) {
      S.available = false;
      S.reason = (e && e.name) || "error";
    }
    return S.available;
  };

  S.getRaw = function (k) {
    if (S.available) { try { return localStorage.getItem(key(k)); } catch (e) { return mem[k] === undefined ? null : mem[k]; } }
    return mem[k] === undefined ? null : mem[k];
  };
  S.setRaw = function (k, v) {
    mem[k] = v;
    if (!S.available) return false;
    try { localStorage.setItem(key(k), v); return true; }
    catch (e) { S.lastError = e; return false; }
  };
  S.remove = function (k) {
    delete mem[k];
    if (!S.available) return;
    try { localStorage.removeItem(key(k)); } catch (e) { /* 無視 */ }
  };
  S.getJSON = function (k) {
    var raw = S.getRaw(k);
    if (raw == null) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  };
  S.setJSON = function (k, obj) { return S.setRaw(k, JSON.stringify(obj)); };

  /* セーブレコードの版管理。将来 v2 にするときは MIGRATIONS[1] に 1→2 の変換を書く */
  S.MIGRATIONS = {};
  S.migrate = function (rec) {
    if (!rec || typeof rec !== "object") return null;
    if (rec.app !== NT.APP) return null;
    var v = rec.v | 0;
    if (v > NT.SAVE_VERSION) return { tooNew: true, rec: rec };
    var guard = 0;
    while (v < NT.SAVE_VERSION && guard++ < 20) {
      var fn = S.MIGRATIONS[v];
      if (!fn) return null;
      rec = fn(rec);
      v = rec.v | 0;
    }
    return { rec: rec };
  };

  S.slotKey = function (n) { return "slot:" + n; };
  S.readSlot = function (n) {
    var r = S.migrate(S.getJSON(S.slotKey(n)));
    return r;
  };
  S.writeSlot = function (n, rec) { return S.setJSON(S.slotKey(n), rec); };
  S.readSuspend = function () { return S.migrate(S.getJSON("suspend")); };
  S.writeSuspend = function (rec) { return S.setJSON("suspend", rec); };
  S.clearSuspend = function () { S.remove("suspend"); };
})();
</script>
<script>
//# sourceURL=src/js/04_codec.js
/* 04_codec.js — メモリーカード（CSV + かな64）の符号化・復号
 *
 * ブラウザ（classic <script> → window.NT.Codec）と Node 22（module.exports）の両方で動く。依存なし。
 *
 * バイト列: "NKT1"(4) | flags(1: bit0=password, bit1=deflated) | salt(16, bit0 時のみ) | iv(12) | AES-GCM(ct+tag)
 * AAD      : ASCII 'nekota-tower/v1'
 * 平文     : UTF-8 JSON {v:1, entries:[{slot, record}]}。CompressionStream('deflate-raw') があれば圧縮して bit1 を立てる。
 * かな64   : 1 記号 = 6 bit。記号数 = ceil(8n/6)、末尾の余りは 0 ビットで埋め、パディング記号は付けない。
 *            復号は floor(6m/8) バイトを取り出す。m % 4 == 1 の長さと、0 でない余りビットは 'format' エラー。
 * CSV      : UTF-8 BOM + "slot,line,data" + 1 行 40 かな。スロットごとに独立した blob（行をスロット単位で連結して復号）。
 */
(function () {
  'use strict';
  var NT = (typeof window !== 'undefined' ? (window.NT = window.NT || {}) : (globalThis.NT = globalThis.NT || {}));

  const VERSION = 1;
  const AAD = 'nekota-tower/v1';
  const MAGIC = 'NKT1';
  const HEADER = 'slot,line,data';
  const BOM = '﻿';
  const LINE_KANA = 40;
  const PBKDF2_ITER = 600000;
  const FLAG_PASSWORD = 1;
  const FLAG_DEFLATED = 2;
  const MAX_LINES = 100000;

  // 埋め込み鍵。ソースを読めば分かるので暗号としての安全性はなく、CSV を手で書き換えにくくする
  // 「難読化」に過ぎない。本当に守りたい場合は opts.password（PBKDF2 → AES-GCM）を使う。
  const EMBEDDED_KEY = new Uint8Array([
    193, 214, 179, 82, 249, 124, 75, 70, 65, 201, 102, 73, 147, 251, 185, 52,
    217, 36, 179, 208, 70, 75, 138, 94, 253, 11, 153, 91, 68, 166, 202, 95
  ]);

  // 凍結表（64 字、重複なし）。見分けにくい対を除外した: ぬ(め) ね・わ(れ) ろ(る) ほ(は) さ(ち) ぢ(じ)。
  // 基本 40 字 + 濁音・半濁音 24 字。変更したら KANA_HASH も更新すること。
  const KANA = 'あいうえおかきくけこしすせそたちつてとなにのはひふへまみむめもやゆよらりるれをん' +
               'がぎぐげござじずぜぞだづでどばびぶべぼぱぴぷぺぽ';
  const KANA_HASH = '9ac27118c62c584b225393593656d1056701390dce4c3025f7ebd6e2e53b90e9';
  const KANA_INDEX = new Map();
  Array.from(KANA).forEach((ch, i) => { KANA_INDEX.set(ch, i); });
  if (KANA.length !== 64 || KANA_INDEX.size !== 64) throw new Error('04_codec: KANA table is broken');

  class CodecError extends Error {
    constructor(code) {
      super('CodecError: ' + code); // 詳細は載せない（呼び出し側で文言を統一する）
      this.name = 'CodecError';
      this.code = code; // 'format' | 'auth' | 'version' | 'unsupported'
    }
  }
  const fail = (code) => new CodecError(code);

  const G = globalThis;
  const subtle = (G.crypto && G.crypto.subtle) ? G.crypto.subtle : null;
  const hasDeflate = typeof G.CompressionStream === 'function' && typeof G.DecompressionStream === 'function';
  const enc = new TextEncoder();
  const dec = new TextDecoder('utf-8', { fatal: true });

  function isSupported() {
    return !!(subtle && hasDeflate && typeof G.TextEncoder === 'function');
  }
  function randomBytes(n) {
    return G.crypto.getRandomValues(new Uint8Array(n));
  }
  function concat(parts) {
    const out = new Uint8Array(parts.reduce((s, p) => s + p.length, 0));
    let o = 0;
    parts.forEach((p) => { out.set(p, o); o += p.length; });
    return out;
  }
  async function pipe(bytes, stream) {
    return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
  }
  function sha256hex(bytes) {
    return subtle.digest('SHA-256', bytes).then((buf) =>
      Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, '0')).join(''));
  }
  // 凍結表が改変されていないか（起動時にも一度確認してコンソールへ出す）
  function verifyKana() {
    if (!subtle) return Promise.resolve(false);
    return sha256hex(enc.encode(KANA)).then((h) => h === KANA_HASH);
  }

  // ---- かな64 ----
  function kanaEncode(bytes) {
    if (!(bytes instanceof Uint8Array)) throw fail('format');
    let out = '';
    let acc = 0;
    let nbits = 0;
    for (let i = 0; i < bytes.length; i++) {
      acc = (acc << 8) | bytes[i];
      nbits += 8;
      while (nbits >= 6) {
        nbits -= 6;
        out += KANA[(acc >> nbits) & 63];
      }
      acc &= (1 << nbits) - 1;
    }
    if (nbits > 0) out += KANA[(acc << (6 - nbits)) & 63]; // 余りは 0 埋め
    return out;
  }
  function kanaDecode(str) {
    if (typeof str !== 'string') throw fail('format');
    const chars = Array.from(str);
    if (chars.length % 4 === 1) throw fail('format'); // この長さは符号化では生じない
    const out = new Uint8Array(Math.floor(chars.length * 6 / 8));
    let acc = 0;
    let nbits = 0;
    let j = 0;
    for (const ch of chars) {
      const v = KANA_INDEX.get(ch);
      if (v === undefined) throw fail('format');
      acc = (acc << 6) | v;
      nbits += 6;
      if (nbits >= 8) {
        nbits -= 8;
        out[j++] = (acc >> nbits) & 255;
        acc &= (1 << nbits) - 1;
      }
    }
    if (acc !== 0) throw fail('format'); // 余りビットが 0 でない
    return out;
  }

  // ---- 暗号 ----
  async function getKey(password, salt) {
    const usage = ['encrypt', 'decrypt'];
    if (password == null) return subtle.importKey('raw', EMBEDDED_KEY, 'AES-GCM', false, usage);
    const base = await subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return subtle.deriveKey({ name: 'PBKDF2', salt, iterations: PBKDF2_ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, usage);
  }
  async function seal(plain, password) {
    if (!subtle) throw fail('unsupported');
    let flags = 0;
    let body = plain;
    if (hasDeflate) { flags |= FLAG_DEFLATED; body = await pipe(plain, new G.CompressionStream('deflate-raw')); }
    const salt = password != null ? randomBytes(16) : new Uint8Array(0);
    if (password != null) flags |= FLAG_PASSWORD;
    const iv = randomBytes(12);
    const key = await getKey(password, salt);
    const ct = new Uint8Array(await subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode(AAD) }, key, body));
    return concat([enc.encode(MAGIC), Uint8Array.of(flags), salt, iv, ct]);
  }
  async function open(blob, password) {
    if (!subtle) throw fail('unsupported');
    if (blob.length < 5) throw fail('format');
    const magic = String.fromCharCode(blob[0], blob[1], blob[2], blob[3]);
    if (magic.slice(0, 3) !== MAGIC.slice(0, 3)) throw fail('format');
    if (magic !== MAGIC) throw fail('version');
    const flags = blob[4];
    if (flags & ~(FLAG_PASSWORD | FLAG_DEFLATED)) throw fail('unsupported');
    const withPw = !!(flags & FLAG_PASSWORD);
    let p = 5;
    const salt = withPw ? blob.slice(p, p + 16) : new Uint8Array(0);
    p += salt.length;
    const iv = blob.slice(p, p + 12);
    p += 12;
    const ct = blob.slice(p);
    if (iv.length !== 12 || salt.length !== (withPw ? 16 : 0) || ct.length < 16) throw fail('format');
    if (withPw && password == null) throw fail('auth');
    let body;
    try {
      const key = await getKey(withPw ? password : null, salt);
      body = new Uint8Array(await subtle.decrypt({ name: 'AES-GCM', iv, additionalData: enc.encode(AAD) }, key, ct));
    } catch (e) {
      throw fail('auth'); // 鍵違い・改ざんはすべて auth（内訳は漏らさない）
    }
    if (flags & FLAG_DEFLATED) {
      if (!hasDeflate) throw fail('unsupported');
      try { body = await pipe(body, new G.DecompressionStream('deflate-raw')); } catch (e) { throw fail('format'); }
    }
    let obj;
    try { obj = JSON.parse(dec.decode(body)); } catch (e) { throw fail('format'); }
    if (!obj || typeof obj !== 'object') throw fail('format');
    if (obj.v !== VERSION) throw fail('version');
    if (!Array.isArray(obj.entries)) throw fail('format');
    return obj;
  }

  // ---- CSV ----
  function isRecord(r) { return !!r && typeof r === 'object'; }
  function checkEntries(entries) {
    if (!Array.isArray(entries) || entries.length === 0) throw fail('format');
    const seen = new Set();
    for (const e of entries) {
      if (!e || !Number.isInteger(e.slot) || e.slot < 1 || e.slot > 3 || !isRecord(e.record)) throw fail('format');
      if (seen.has(e.slot)) throw fail('format');
      seen.add(e.slot);
    }
  }
  function passwordOf(opts) {
    const pw = opts && opts.password;
    return (typeof pw === 'string' && pw.length > 0) ? pw : null;
  }

  // entries: [{slot:1..3, record:Object}] → BOM 付き CSV 文字列。スロットごとに 1 blob。
  async function encodeCard(entries, opts) {
    checkEntries(entries);
    const password = passwordOf(opts);
    const lines = [HEADER];
    for (const e of entries) {
      const plain = enc.encode(JSON.stringify({ v: VERSION, entries: [{ slot: e.slot, record: e.record }] }));
      const kana = kanaEncode(await seal(plain, password));
      for (let i = 0, n = 0; i < kana.length; i += LINE_KANA, n++) {
        lines.push(e.slot + ',' + n + ',' + kana.slice(i, i + LINE_KANA));
      }
    }
    return BOM + lines.join('\n') + '\n';
  }

  // CSV 文字列 → [{slot, record}]（slot 昇順）。失敗は CodecError。
  async function decodeCard(csvText, opts) {
    if (typeof csvText !== 'string') throw fail('format');
    const text = csvText.charCodeAt(0) === 0xFEFF ? csvText.slice(1) : csvText;
    const password = passwordOf(opts);
    const groups = new Map(); // slot → Map(line → data)
    for (const raw of text.split(/\r\n|\n|\r/)) {
      const line = raw.trim();
      if (!line) continue;
      const cells = line.split(',').map((s) => s.trim());
      if (cells.length !== 3) throw fail('format');
      if (cells.join(',').toLowerCase() === HEADER) continue;
      if (!/^\d{1,3}$/.test(cells[0]) || !/^\d{1,6}$/.test(cells[1])) throw fail('format');
      const slot = Number(cells[0]);
      const n = Number(cells[1]);
      const data = cells[2].replace(/[\s　]+/g, '');
      if (!data || n >= MAX_LINES) throw fail('format');
      if (!groups.has(slot)) groups.set(slot, new Map());
      const g = groups.get(slot);
      if (g.has(n)) throw fail('format'); // 行番号の重複
      g.set(n, data);
    }
    if (groups.size === 0) throw fail('format');
    const out = [];
    for (const [slot, g] of groups) {
      let kana = '';
      for (let i = 0; i < g.size; i++) {
        if (!g.has(i)) throw fail('format'); // 欠番
        kana += g.get(i);
      }
      const obj = await open(kanaDecode(kana), password);
      for (const ent of obj.entries) {
        if (!ent || ent.slot !== slot || !isRecord(ent.record)) throw fail('format');
        out.push({ slot: ent.slot, record: ent.record });
      }
    }
    out.sort((a, b) => a.slot - b.slot);
    return out;
  }

  // 'nekota-tower_card_YYYYMMDD_slotN.csv'（呼び出し側のローカル時刻）
  function fileName(slot, date) {
    const d = date instanceof Date ? date : new Date(date === undefined ? Date.now() : date);
    if (!Number.isInteger(slot) || Number.isNaN(d.getTime())) throw fail('format');
    const p = (n) => String(n).padStart(2, '0');
    return 'nekota-tower_card_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_slot' + slot + '.csv';
  }

  NT.Codec = Object.freeze({
    VERSION, AAD, KANA, KANA_HASH, LINE_KANA, CodecError,
    encodeCard, decodeCard, kanaEncode, kanaDecode, isSupported, fileName, verifyKana
  });

  verifyKana().then((ok) => { if (subtle && !ok) console.error('04_codec: KANA_HASH mismatch'); });

  if (typeof module !== 'undefined') module.exports = NT.Codec;
})();
</script>

/* 入力。KeyboardEvent.code でキー配列に依存しない。IME 合成中と入力欄上は無視する */
(function () {
  "use strict";
  var NT = window.NT;
  var I = NT.Input = {};
  var MAP = {
    ok: ["KeyZ", "Enter", "Space", "NumpadEnter"],
    cancel: ["KeyX", "Escape", "Backspace"],
    menu: ["KeyC", "Tab"],
    up: ["ArrowUp", "KeyW"],
    down: ["ArrowDown", "KeyS"],
    left: ["ArrowLeft", "KeyA"],
    right: ["ArrowRight", "KeyD"],
    dash: ["ShiftLeft", "ShiftRight"]
  };
  var codeToAction = {};
  Object.keys(MAP).forEach(function (a) { MAP[a].forEach(function (c) { codeToAction[c] = a; }); });

  var held = {};      // action -> true
  var pressed = {};   // action -> true（このフレームで押された）
  var anyKeyFlag = false;
  var clicks = [];    // {x,y}（内部解像度）
  var repeatTimers = {};
  I.typing = false;   // 22_inputbox が入力欄を開いている間 true
  I.lastDevice = "key";
  var listeners = [];

  function isTypingTarget(e) {
    var t = e.target;
    if (!t) return false;
    var tag = (t.tagName || "").toLowerCase();
    return tag === "input" || tag === "textarea" || t.isContentEditable;
  }

  function onKeyDown(e) {
    if (I.typing || isTypingTarget(e) || e.isComposing || e.keyCode === 229) return;
    var a = codeToAction[e.code];
    I.lastDevice = "key";
    if (e.code === "Tab" || e.code === "Backspace" || e.code === "Space" || /^Arrow/.test(e.code)) e.preventDefault();
    if (!e.repeat) { anyKeyFlag = true; }
    if (!a) return;
    if (!e.repeat) {
      if (!held[a]) { pressed[a] = true; repeatTimers[a] = 0; }
      held[a] = true;
    }
    listeners.forEach(function (fn) { fn(a, e); });
  }
  function onKeyUp(e) {
    var a = codeToAction[e.code];
    if (!a) return;
    held[a] = false;
    delete repeatTimers[a];
  }
  function reset() { held = {}; pressed = {}; repeatTimers = {}; }

  I.install = function (canvas) {
    window.addEventListener("keydown", onKeyDown, true);
    window.addEventListener("keyup", onKeyUp, true);
    window.addEventListener("blur", reset);
    document.addEventListener("visibilitychange", function () { if (document.hidden) reset(); });
    canvas.addEventListener("pointerdown", function (e) {
      I.lastDevice = "pointer";
      anyKeyFlag = true;
      var r = canvas.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width * NT.W;
      var y = (e.clientY - r.top) / r.height * NT.H;
      clicks.push({ x: Math.floor(x), y: Math.floor(y), button: e.button });
      if (!I.typing) { try { canvas.focus({ preventScroll: true }); } catch (err) { canvas.focus(); } }
      e.preventDefault();
    });
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  };

  /* フレーム末に呼ぶ。pressed を消し、長押しリピートを作る（メニュー移動用） */
  I.endFrame = function (dt) {
    pressed = {};
    clicks.length = 0;
    anyKeyFlag = false;
    ["up", "down", "left", "right"].forEach(function (a) {
      if (!held[a]) return;
      repeatTimers[a] = (repeatTimers[a] || 0) + dt;
      if (repeatTimers[a] > 320) { pressed[a] = true; repeatTimers[a] = 320 - 90; }
    });
  };
  I.pressed = function (a) { return !!pressed[a]; };
  I.held = function (a) { return !!held[a]; };
  I.anyKey = function () { return anyKeyFlag; };
  I.clicks = function () { return clicks; };
  I.consume = function (a) { pressed[a] = false; };
  I.onKey = function (fn) { listeners.push(fn); };
  I.reset = reset;
  /* 方向入力を -1/0/1 で返す */
  I.axis = function () {
    var x = (held.right ? 1 : 0) - (held.left ? 1 : 0);
    var y = (held.down ? 1 : 0) - (held.up ? 1 : 0);
    return { x: x, y: y };
  };
  /* テスト用：仮想押下 */
  I.press = function (a) { pressed[a] = true; anyKeyFlag = true; };
  I.click = function (x, y) { clicks.push({ x: x, y: y, button: 0 }); anyKeyFlag = true; };
})();
</script>

/* 合成音。音源ファイルは持たず、矩形波・三角波・ノイズで鳴らす。AudioContext は最初の操作（電源ボタン）で起こす */
(function () {
  "use strict";
  var NT = window.NT;
  var A = NT.Audio = { ctx: null, master: null, sfxOn: true, musicTimer: null };
  var midi = function (n) { return 440 * Math.pow(2, (n - 69) / 12); };
  A.midi = midi;

  A.unlock = function () {
    if (A.ctx) { if (A.ctx.state === "suspended") A.ctx.resume().catch(function () {}); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      A.ctx = new AC();
      A.master = A.ctx.createGain();
      A.master.gain.value = 0.45;
      A.master.connect(A.ctx.destination);
    } catch (e) { A.ctx = null; }
  };
  A.suspend = function (on) {
    if (!A.ctx) return;
    if (on) A.ctx.suspend().catch(function () {}); else A.ctx.resume().catch(function () {});
  };
  A.setSfx = function (on) { A.sfxOn = !!on; };

  /* 1音。duty 付き矩形波は PeriodicWave で作る */
  var waves = {};
  function pulse(ctx, duty) {
    var k = "p" + duty;
    if (waves[k]) return waves[k];
    var n = 32, real = new Float32Array(n), imag = new Float32Array(n);

/* 画面。320×240 の canvas を整数倍で中央に置く。既定はデバイスピクセル基準（Windows の 125%/150% でも均一なドットになる） */
(function () {
  "use strict";
  var NT = window.NT;
  var S = NT.Screen = {};
  S.canvas = null; S.ctx = null; S.stage = null; S.crt = null;
  S.scale = 2; S.cssScale = 2; S.mode = "device"; // 'device' | 'css'
  S.crtOn = true;

  S.init = function () {
    S.stage = document.getElementById("stage");
    S.canvas = document.getElementById("game");
    S.crt = document.getElementById("crt");
    S.canvas.width = NT.W; S.canvas.height = NT.H;
    S.ctx = S.canvas.getContext("2d", { alpha: false });
    S.ctx.imageSmoothingEnabled = false;
    S.fit();
    window.addEventListener("resize", S.fit);
    try {
      var mq = window.matchMedia("(resolution: " + window.devicePixelRatio + "dppx)");
      if (mq && mq.addEventListener) mq.addEventListener("change", S.fit);
    } catch (e) { /* 無視 */ }
  };

  S.fit = function () {
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    var cssW, cssH, n;
    if (S.mode === "device") {
      n = Math.max(1, Math.floor(Math.min(vw * dpr / NT.W, vh * dpr / NT.H)));
      cssW = NT.W * n / dpr; cssH = NT.H * n / dpr;
      S.scale = n; S.cssScale = n / dpr;
    } else {
      n = Math.max(1, Math.floor(Math.min(vw / NT.W, vh / NT.H)));
      cssW = NT.W * n; cssH = NT.H * n;
      S.scale = n * dpr; S.cssScale = n;
    }
    var root = document.documentElement.style;
    root.setProperty("--stage-w", cssW + "px");
    root.setProperty("--stage-h", cssH + "px");
    root.setProperty("--scale", String(S.cssScale));
    S.ctx.imageSmoothingEnabled = false;
  };

  S.setMode = function (m) { S.mode = m === "css" ? "css" : "device"; S.fit(); };

    S.crtOn = !!on;
    if (S.crt) S.crt.classList.toggle("off", !S.crtOn);
  };

  S.toCss = function (v) { return v * S.cssScale; };

    S.ctx.fillStyle = color || "#000";
    S.ctx.fillRect(0, 0, NT.W, NT.H);
  };
})();

/* 埋め込みフォントの読込待ち。最初の文字描画より前に ready を待つ */
(function () {
  "use strict";
  var NT = window.NT;
  var F = NT.Fonts = { ready: false, ok: false };
  var promise = null;
  F.load = function () {
    if (promise) return promise;
    var loads = [];
    if (document.fonts && document.fonts.load) {
      loads.push(document.fonts.load('12px "PM12"', "あ"));
      loads.push(document.fonts.load('16px "DG16"', "あ"));
    }
    var timeout = new Promise(function (res) { setTimeout(function () { res("timeout"); }, 3000); });
    promise = Promise.race([Promise.all(loads), timeout]).then(function (r) {
      F.ready = true;
      F.ok = r !== "timeout" && (!document.fonts || document.fonts.check('12px "PM12"'));
    }).catch(function () { F.ready = true; F.ok = false; });
    return promise;
  };
  F.check = function () {
    try { return !!(document.fonts && document.fonts.check('12px "PM12"')); } catch (e) { return false; }
  };
})();

/* 文字描画。全角 12px / 半角 6px の固定ピッチで、折り返しと禁則を自前で行う */
(function () {
  "use strict";
  var NT = window.NT;
  var T = NT.Text = {};
  T.FULL = 12; T.HALF = 6; T.LH = 16;
  var HALF_RE = /[ -~｡-ﾟ]/;
  var NO_HEAD = "、。，．・：；？！ー）」』】〕〉》〙〗〟’”｝〉ぁぃぅぇぉっゃゅょゎゕゖァィゥェォッャュョヮヵヶ々〻–〜~!?,.:;)]}";
  var NO_TAIL = "（「『【〔〈《〘〖〝‘“｛([{";
  var HANG = "、。，．,.";

  T.isHalf = function (ch) { return HALF_RE.test(ch); };
  T.width = function (ch) { return T.isHalf(ch) ? T.HALF : T.FULL; };

  /* 文字列を幅 maxW(px) に収まる行に分ける。'\n' は強制改行 */
  T.wrap = function (text, maxW) {
    var lines = [];
    String(text).split("\n").forEach(function (para) {
      var chars = Array.from(para);
      var line = "", w = 0;
      for (var i = 0; i < chars.length; i++) {
        var ch = chars[i], cw = T.width(ch);
        if (w + cw > maxW) {
          if (HANG.indexOf(ch) >= 0 && line) { line += ch; lines.push(line); line = ""; w = 0; continue; }
          if (NO_HEAD.indexOf(ch) >= 0 && line.length > 1) {
            var last = line[line.length - 1];
            if (NO_TAIL.indexOf(last) < 0) { line = line.slice(0, -1); lines.push(line); line = last + ch; w = T.width(last) + cw; continue; }
          }
          if (line && NO_TAIL.indexOf(line[line.length - 1]) >= 0) {
            var l2 = line[line.length - 1]; line = line.slice(0, -1); lines.push(line); line = l2 + ch; w = T.width(l2) + cw; continue;
          }
          lines.push(line); line = ch; w = cw; continue;
        }
        line += ch; w += cw;
      }
      lines.push(line);
    });
    return lines;
  };

    ctx.font = (size || 12) + "px " + (head ? NT.FONT_HEAD : NT.FONT_BODY);

  /* タイルセット。インデックスは 40_tilemap.js と共有 */

    c.fillStyle = "#8c5a2b"; c.fillRect(at(7) + 3, 2, 4, 13); c.fillRect(at(7) + 9, 2, 4, 13);
    c.fillStyle = "#f4d03f"; c.fillRect(at(7) + 7, 8, 2, 2);

    c.fillStyle = "#fff6d6"; c.fillRect(at(8) + 3, 1, 10, 15);
    c.fillStyle = "#f4d03f"; c.fillRect(at(8) + 5, 3, 6, 11);

//# sourceURL=src/js/11_sprites.js
/* スプライト：SVG 文字列を 32x40 の offscreen canvas にラスタライズしてキャッシュ */
(function () {
  "use strict";
  var NT = window.NT = window.NT || {};

  var SW = 32, SH = 40;
  var DIRS = ['down', 'up', 'left', 'right'];
  var FRAMES = [-1, 0, 1];
  var NPC_IDS = ['elder', 'npc10', 'npc9', 'npc8', 'npc7', 'npc6', 'npc5', 'npc4', 'npc3', 'npc2', 'npc1', 'boss'];
  var TIMEOUT_MS = 2000;

  var cache = {};
  var loading = null;

  function makeCanvas() {
    var c = document.createElement('canvas');
    c.width = SW; c.height = SH;
    return c;
  }

  // 失敗時の代替：耳付きの色つき団子
  function placeholder(color) {
    var c = makeCanvas();
    var g = c.getContext('2d');
    g.fillStyle = color || '#CDBDEC';
    g.beginPath(); g.ellipse(16, 24, 10, 9, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.moveTo(7, 20); g.lineTo(9, 10); g.lineTo(14, 16); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(25, 20); g.lineTo(23, 10); g.lineTo(18, 16); g.closePath(); g.fill();
    g.fillStyle = '#3A3A45';
    g.fillRect(12, 22, 2, 3); g.fillRect(18, 22, 2, 3);
    return c;
  }

  function rasterize(svg) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var done = false;
      var timer = setTimeout(function () {
        if (done) return; done = true; reject(new Error('timeout'));
      }, TIMEOUT_MS);
      function finish(err) {
        if (done) return; done = true; clearTimeout(timer);
        if (err) { reject(err); return; }
        try {
          var c = makeCanvas();
          var g = c.getContext('2d');
          g.imageSmoothingEnabled = false;
          g.drawImage(img, 0, 0, SW, SH);
          resolve(c);
        } catch (e) { reject(e); }
      }
      img.onerror = function () { finish(new Error('load error')); };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      var p = (typeof img.decode === 'function') ? img.decode() : new Promise(function (ok) { img.onload = ok; });
      p.then(function () { finish(null); }, function (e) { finish(e || new Error('decode error')); });
    });
  }

  function loadOne(key, svg, color) {
    return rasterize(svg).then(function (c) {
      cache[key] = c;
    }, function () {
      cache[key] = placeholder(color);
      NT.Sprites.failed.push(key);
    });
  }

  NT.Sprites = {
    ready: false,
    failed: [],
    W: SW,
    H: SH,

    /** 全バリアントをラスタライズ。2回目以降は同じ Promise を返す */
    load: function () {
      if (loading) return loading;
      var jobs = [];
      DIRS.forEach(function (d) {
        FRAMES.forEach(function (f) {
          jobs.push(loadOne('nekota:' + d + ':' + f, NT.SVG.nekota(d, f, { sushi: true }), '#CDBDEC'));
        });
      });
      jobs.push(loadOne('nekota:down:0:wave', NT.SVG.nekota('down', 0, { sushi: true, wave: true }), '#CDBDEC'));
      NPC_IDS.forEach(function (id) {
        jobs.push(loadOne('npc:' + id, NT.SVG.npc(id), '#B9B6C4'));
      });
      loading = Promise.all(jobs).then(function () {
        NT.Sprites.ready = true;
      });
      return loading;
    },

    /** @returns {HTMLCanvasElement} 未知キーはプレースホルダ（キャッシュする） */
    get: function (key) {
      var c = cache[key];
      if (!c) {
        c = cache[key] = placeholder('#CDBDEC');
        if (NT.Sprites.failed.indexOf(key) < 0) NT.Sprites.failed.push(key);
      }
      return c;
    },

    /** 足元中心 (x,y) に描く。内部解像度ピクセルで整数に丸める */
    draw: function (ctx, key, x, y) {
      ctx.drawImage(NT.Sprites.get(key), Math.round(x) - (SW >> 1), Math.round(y) - SH);
    },

    keys: function () {
      return Object.keys(cache);
    }
  };
})();
</script>

/* シーンスタック。不透明なシーンまで遡って下から順に描く（会話やメニューはマップの上に重なる） */
(function () {
  "use strict";
  var NT = window.NT;
  var S = NT.Scenes = { stack: [] };

  S.top = function () { return S.stack[S.stack.length - 1] || null; };
  S.push = function (scene) {
    var cur = S.top();
    if (cur && cur.pause) cur.pause();
    S.stack.push(scene);
    if (scene.enter) scene.enter();
    return scene;
  };
  S.pop = function (result) {
    var s = S.stack.pop();
    if (s && s.exit) s.exit(result);
    var cur = S.top();
    if (cur && cur.resume) cur.resume(result, s);
    return s;
  };
  /* 特定のシーンを（先頭でなくても）取り除く。会話から別画面を開いた直後に会話を閉じる場合に使う */
  S.remove = function (scene, result) {
    var i = S.stack.indexOf(scene);
    if (i < 0) return null;
    var wasTop = i === S.stack.length - 1;
    S.stack.splice(i, 1);
    if (scene.exit) scene.exit(result);
    var cur = S.top();
    if (wasTop && cur && cur.resume) cur.resume(result, scene);
    return scene;
  };
  S.replace = function (scene) {
    var s = S.stack.pop();
    if (s && s.exit) s.exit();
    S.stack.push(scene);
    if (scene.enter) scene.enter();
    return scene;
  };
  S.reset = function (scene) {
    while (S.stack.length) { var s = S.stack.pop(); if (s && s.exit) s.exit(); }
    S.push(scene);
  };
  S.has = function (id) { return S.stack.some(function (s) { return s.id === id; }); };
  S.find = function (id) { for (var i = S.stack.length - 1; i >= 0; i--) if (S.stack[i].id === id) return S.stack[i]; return null; };

  S.update = function (dt) {
    var t = S.top();
    if (t && t.update) t.update(dt);
  };
  S.draw = function (ctx) {
    var i = S.stack.length - 1;
    while (i > 0 && !S.stack[i].opaque) i--;
    for (; i < S.stack.length; i++) if (S.stack[i].draw) S.stack[i].draw(ctx);
  };
  S.ids = function () { return S.stack.map(function (s) { return s.id; }); };
})();
</script>

/* 固定ステップのゲームループ。ヒットストップは freeze(frames) で止める */
(function () {
  "use strict";
  var NT = window.NT;
  var L = NT.Loop = { running: false, frame: 0, freezeFrames: 0, elapsed: 0, fps: 0 };
  var acc = 0, last = 0, raf = 0, fpsAcc = 0, fpsN = 0;
  var hooks = { pre: [], post: [] };

  function tick(now) {
    raf = requestAnimationFrame(tick);
    if (!last) last = now;
    var dt = Math.min(now - last, NT.STEP * 5);
    last = now;
    if (document.hidden) return;
    acc += dt;
    while (acc >= NT.STEP) {
      acc -= NT.STEP;
      L.frame++;
      if (L.freezeFrames > 0) { L.freezeFrames--; continue; }
      L.elapsed += NT.STEP;
      hooks.pre.forEach(function (f) { f(NT.STEP); });
      NT.Scenes.update(NT.STEP);
      NT.Input.endFrame(NT.STEP);
      hooks.post.forEach(function (f) { f(NT.STEP); });
    }
    NT.Scenes.draw(NT.Screen.ctx);
    if (L.shakeTimer > 0) { L.shakeTimer -= dt; if (L.shakeTimer <= 0) NT.Screen.canvas.style.transform = ""; }
    fpsAcc += dt; fpsN++;
    if (fpsAcc >= 1000) { L.fps = Math.round(fpsN * 1000 / fpsAcc); fpsAcc = 0; fpsN = 0; }
  }
  L.start = function () { if (L.running) return; L.running = true; last = 0; raf = requestAnimationFrame(tick); };
  L.stop = function () { L.running = false; cancelAnimationFrame(raf); };
  L.freeze = function (frames) { L.freezeFrames = Math.max(L.freezeFrames, Math.min(24, frames | 0)); };
  L.onPre = function (f) { hooks.pre.push(f); };
  L.onPost = function (f) { hooks.post.push(f); };
  /* 画面揺れ（CSS transform。reduced-motion では無効） */
  L.shakeTimer = 0;
  L.shake = function (px, ms) {
    if (NT.Settings && NT.Settings.get("reduceMotion")) return;
    var cv = NT.Screen.canvas, s = NT.Screen.cssScale;
    cv.style.transform = "translate(" + (px * s) + "px," + (-px * s * 0.6) + "px)";
    L.shakeTimer = ms || 60;
  };
  /* テスト用：手動で n ステップ進める */
  L.stepManual = function (n) {
    for (var i = 0; i < (n || 1); i++) { NT.Scenes.update(NT.STEP); NT.Input.endFrame(NT.STEP); }
    NT.Scenes.draw(NT.Screen.ctx);
  };
})();
</script>

/* ゲーム状態。セーブはこの state を丸ごと JSON にしたもの */
(function () {
  "use strict";
  var NT = window.NT;
  var S = NT.State = { cur: null, dirty: false, playMs: 0, seq: 0, slot: 0, loadedFrom: null };
  var listeners = [];

  S.TITLES = [[10, "人生最高の余暇"], [8, "けんじゃ"], [5, "ゆうしゃ"], [3, "ぼうけんしゃ"], [1, "みならい"], [0, "たびびと"]];
  S.titleFor = function (n) { for (var i = 0; i < S.TITLES.length; i++) if (n >= S.TITLES[i][0]) return S.TITLES[i][1]; return "たびびと"; };

  S.newGame = function (name) {
    var key = NT.Time.jstKey();
    var quests = {};
    Object.keys(NT.DATA.QUESTS || {}).forEach(function (id) { quests[id] = { status: "offered" }; });
    S.cur = {
      name: name || "ねこ太のともだち",
      startedKey: key, lastKey: key, year: NT.Time.yearOf(key),
      pos: null, floor: 10,
      flags: { prologueDone: false, doorOpen: false, clockSuspect: false, resultShown: false, tutorialDone: false },
      clears: [], marks: 0, title: "たびびと",
      flowers: {},
      quests: quests,
      lessons: [], log: [],
      lap: 1
    };
    S.playMs = 0; S.seq = 0; S.dirty = false; S.slot = 0; S.loadedFrom = "new";
    S.recompute();
    return S.cur;
  };

  S.load = function (rec, slot) {
    S.cur = rec.state;
    S.playMs = rec.playMs || 0;
    S.seq = rec.seq || 0;
    S.slot = slot || 0;
    S.dirty = false;
    S.loadedFrom = "slot";
    if (!S.cur.flags) S.cur.flags = {};
    if (!S.cur.quests) S.cur.quests = {};
    Object.keys(NT.DATA.QUESTS || {}).forEach(function (id) { if (!S.cur.quests[id]) S.cur.quests[id] = { status: "offered" }; });
    if (NT.Time.clockSuspect(rec)) S.cur.flags.clockSuspect = true;
    S.recompute();
    return S.cur;
  };

  S.toRecord = function () {
    S.seq++;
    return {
      v: NT.SAVE_VERSION, app: NT.APP, build: NT.BUILD,
      savedAt: new Date(NT.Time.now()).toISOString(),
      seq: S.seq, playMs: Math.round(S.playMs),
      state: NT.Util.deepClone(S.cur)
    };
  };

  S.setDirty = function (v) {
    var was = S.dirty;
    S.dirty = v !== false;
    if (was !== S.dirty) listeners.forEach(function (f) { f(S.dirty); });
  };
  S.onDirty = function (f) { listeners.push(f); };
  S.touch = function () { S.setDirty(true); };

  S.clearCount = function () { return S.cur ? S.cur.clears.length : 0; };
  S.recompute = function () {
    var c = S.cur; if (!c) return;
    c.marks = c.clears.length;
    c.title = S.titleFor(c.marks);
    c.doorWasOpen = c.flags.doorOpen;
    c.flags.doorOpen = c.marks >= 3;
    var today = NT.Time.jstKey();
    if (today > (c.lastKey || "")) c.lastKey = today;
  };
  S.addLog = function (ev, text) {
    if (!S.cur) return;
    S.cur.log.push({ t: new Date(NT.Time.now()).toISOString(), k: NT.Time.jstKey(), ev: ev, text: text || "" });
    if (S.cur.log.length > 400) S.cur.log.shift();
    S.touch();
  };
  S.addLesson = function (q, text) {
    if (!S.cur || !text) return;
    S.cur.lessons.push({ q: q, text: text, k: NT.Time.jstKey() });
    S.touch();
  };
  S.tick = function (dt) { if (S.cur) S.playMs += dt; };
  S.playTimeText = function (ms) {
    ms = ms === undefined ? S.playMs : ms;
    var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h + ":" + NT.Util.pad2(m) + ":" + NT.Util.pad2(s % 60);
  };
  S.phase = function () { return NT.Time.phase(NT.Time.jstKey(), S.cur ? S.cur.year : undefined); };
  S.daysLeft = function () { return NT.Time.daysLeft(NT.Time.jstKey(), S.cur ? S.cur.year : undefined); };
  S.feelDays = function () { return NT.Time.feelDays(NT.Time.jstKey(), S.cur ? S.cur.year : undefined); };
})();

/* 設定。本体メモリに保存する */
(function () {
  "use strict";
  var NT = window.NT;
  var S = NT.Settings = {};
  var DEF = { msgSpeed: 1, sfx: true, crt: true, scaleMode: "device", reduceMotion: false };
  var cur = NT.Util.assign({}, DEF);
  S.SPEEDS = [{ id: 0, label: "そくじ", cps: 0 }, { id: 1, label: "ふつう", cps: 1, ms: 30 }, { id: 2, label: "はやい", cps: 2, ms: 30 }, { id: 3, label: "おそい", cps: 1, ms: 60 }];

  S.load = function () {
    var saved = NT.Storage.getJSON("settings");
    if (saved) NT.Util.assign(cur, saved);
    if (!("reduceMotion" in (saved || {}))) {
      try { cur.reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) { /* 無視 */ }
    }
    if (NT.query.nocrt) cur.crt = false;
    S.apply();
  };
  S.save = function () { NT.Storage.setJSON("settings", cur); };
  S.get = function (k) { return cur[k]; };
  S.set = function (k, v) { cur[k] = v; S.apply(); S.save(); };
  S.all = function () { return NT.Util.assign({}, cur); };
  S.apply = function () {
    NT.Screen.setCRT(cur.crt);
    NT.Screen.setMode(cur.scaleMode);
    NT.Audio.setSfx(cur.sfx);
    if (NT.Screen.crt) NT.Screen.crt.classList.toggle("still", !!cur.reduceMotion);
  };
  /* 文字送り：1ステップあたりの表示文字数（小数可）*/
  S.charsPerStep = function () {
    var sp = S.SPEEDS[cur.msgSpeed] || S.SPEEDS[1];
    if (sp.cps === 0) return Infinity;
    return sp.cps * NT.STEP / sp.ms;
  };
})();

<script>
//# sourceURL=src/js/20_dialog.js
/* 会話ウィンドウ。data/dialogs.js のスクリプトを解釈する
   ステップ: {text, who} | {choice:[{label, goto, end, call, arg, value}]} | {if, goto, else} | {goto} | {set:{flag:value}} | {call, arg} | {sfx} | {wait} | {end:true}
   if 条件: 'quest:<id>:<status>' | 'quest:<id>:!<status>' | 'flag:<name>' | '!flag:<name>' | 'clears>=<n>' | 'phase:<name>' | 'impl:<id>' */
(function () {
  "use strict";
  var NT = window.NT;
  var T = NT.Text, G = NT.Gfx, I = NT.Input;
  var D = NT.Dialog = {};
  D.hooks = {};   /* call 名 → function(arg, dialog) */

  D.evalCond = function (cond) {
    var st = NT.State.cur || { flags: {}, quests: {}, clears: [] };
    var neg = false;
    if (cond[0] === "!") { neg = true; cond = cond.slice(1); }
    var r = false, m;
    if ((m = /^quest:(\w+):(!?)(\w+)$/.exec(cond))) {
      var q = st.quests[m[1]] || { status: "offered" };
      r = (q.status === m[3]); if (m[2] === "!") r = !r;
    } else if ((m = /^flag:(\w+)$/.exec(cond))) r = !!st.flags[m[1]];
    else if ((m = /^clears>=(\d+)$/.exec(cond))) r = st.clears.length >= +m[1];
    else if ((m = /^phase:(\w+)$/.exec(cond))) r = NT.State.phase() === m[1];
    else if ((m = /^impl:(\w+)$/.exec(cond))) r = !!(NT.DATA.QUESTS[m[1]] && NT.DATA.QUESTS[m[1]].implemented);
    else if ((m = /^reportable:(\w+)$/.exec(cond))) r = NT.Quests ? NT.Quests.isReportable(m[1]) : false;
    return neg ? !r : r;
  };

  D.vars = function () {
    var st = NT.State.cur || {};
    return { name: st.name || "", daysLeft: NT.State.daysLeft(), feel: NT.State.feelDays(), marks: st.marks || 0, title: st.title || "" };
  };

  /* 会話シーンを開く。id はスクリプト名、または直接ステップ配列。opts.onEnd(result) */
  D.open = function (id, opts) {
    opts = opts || {};
    var script = Array.isArray(id) ? id : (NT.DATA.DIALOGS[id] || [{ text: "（" + id + " がみつからない）" }]);
    var scene = D.scene(script, opts);
    NT.Scenes.push(scene);
    return scene;
  };

  D.scene = function (script, opts) {
    var pc = 0, result = null;
    var page = null;          // {lines, shown, total, who}
    var choice = null;        // {items, index}
    var waitMs = 0, blink = 0, done = false;
    var W = 304, H = 76, X = 8, Y = NT.H - H - 6;
    var innerW = W - 24;

    function showText(text, who) {
      var lines = T.wrap(NT.Util.fmt(text, D.vars()), innerW);
      page = { lines: lines, shown: 0, total: T.countChars(lines), who: who || null, pages: [], pi: 0 };
      var per = who ? 3 : 4;
      for (var i = 0; i < lines.length; i += per) page.pages.push(lines.slice(i, i + per));
      page.cur = page.pages[0]; page.curTotal = T.countChars(page.cur);
    }
    function nextPage() {
      page.pi++;
      if (page.pi >= page.pages.length) { page = null; return false; }
      page.cur = page.pages[page.pi]; page.curTotal = T.countChars(page.cur); page.shown = 0;
      return true;
    }
    function finish(res) {
      if (done) return;
      done = true;
      NT.Scenes.remove(scene, res);
      if (opts.onEnd) opts.onEnd(res);
    }
    function gotoLabel(label) {
      if (Array.isArray(NT.DATA.DIALOGS[label])) { script = NT.DATA.DIALOGS[label]; pc = 0; return; }
      finish(result);
    }
    function step() {
      while (!page && !choice && waitMs <= 0 && !done) {
        if (pc >= script.length) { finish(result); return; }
        var s = script[pc++];
        if (typeof s === "string") { showText(s); return; }
        if (s.text !== undefined) { showText(s.text, s.who); return; }
        if (s.choice) {
          var items = s.choice.filter(function (c) { return !c.if || D.evalCond(c.if); });
          choice = { items: items, index: 0, title: s.title || null };
          return;
        }
        if (s.if) { if (D.evalCond(s.if)) { if (s.goto) gotoLabel(s.goto); else if (s.then) { script = s.then; pc = 0; } } else if (s.else) gotoLabel(s.else); continue; }
        if (s.goto) { gotoLabel(s.goto); continue; }
        if (s.set) { for (var k in s.set) { NT.State.cur.flags[k] = s.set[k]; } NT.State.touch(); continue; }
        if (s.call) { var fn = D.hooks[s.call]; if (fn) { var r = fn(s.arg, scene); if (r === "stop") { finish(result); return; } } continue; }
        if (s.sfx) { NT.Audio.play(s.sfx); continue; }
        if (s.wait) { waitMs = s.wait; return; }
        if (s.result !== undefined) { result = s.result; continue; }
        if (s.end) { finish(result); return; }
      }
    }
    var scene = {
      id: "DIALOG", opaque: false,
      enter: function () { step(); },
      update: function (dt) {
        blink += dt;
        if (waitMs > 0) { waitMs -= dt; if (waitMs <= 0) step(); return; }
        if (choice) {
          if (I.pressed("up")) { choice.index = (choice.index + choice.items.length - 1) % choice.items.length; NT.Audio.play("cursor"); }
          if (I.pressed("down")) { choice.index = (choice.index + 1) % choice.items.length; NT.Audio.play("cursor"); }
          var cl = I.clicks();
          for (var k = 0; k < cl.length; k++) {
            var box = choiceBox();
            for (var i = 0; i < choice.items.length; i++) {
              var ry = box.y + 10 + (choice.title ? 16 : 0) + i * 16;
              if (cl[k].x >= box.x && cl[k].x < box.x + box.w && cl[k].y >= ry - 2 && cl[k].y < ry + 14) { choice.index = i; I.press("ok"); }
            }

          if (I.pressed("ok")) {

            if (c.set) { for (var kk in c.set) NT.State.cur.flags[kk] = c.set[kk]; NT.State.touch(); }
            if (c.call) { var fn = D.hooks[c.call]; if (fn && fn(c.arg, scene) === "stop") { finish(result); return; } }
            if (c.end) { finish(result); return; }
            if (c.goto) gotoLabel(c.goto);

          if (page.shown < page.curTotal) {
            var per = NT.Settings.charsPerStep();
            var before = Math.floor(page.shown);
            page.shown = Math.min(page.curTotal, page.shown + per);
            if (Math.floor(page.shown) !== before && (Math.floor(page.shown) % 3 === 0)) NT.Audio.play("tap");
            if (I.pressed("ok") || I.clicks().length) { I.consume("ok"); page.shown = page.curTotal; }
            return;
          }
          if (I.pressed("ok") || I.pressed("cancel") || I.clicks().length) {
            I.consume("ok"); I.consume("cancel");
            if (!nextPage()) step();
          }
        }
      },
      draw: function (ctx) {
        if (page) {
          G.frame(ctx, X, Y, W, H);
          var ty = Y + 10;
          if (page.who) { T.draw(ctx, page.who, X + 12, ty, "#f4d03f"); ty += 16; }
          T.drawLines(ctx, page.cur, X + 12, ty, "#f4f1e8", Math.floor(page.shown));
          if (page.shown >= page.curTotal && (blink % 1000) < 500) {
            var more = page.pi < page.pages.length - 1 || pc < script.length;
            if (more) G.nextMark(ctx, X + W - 18, Y + H - 10, "#f4d03f");
          }
        }
        if (choice) {
          var box = choiceBox();
          G.frame(ctx, box.x, box.y, box.w, box.h);
          var y0 = box.y + 10;
          if (choice.title) { T.draw(ctx, choice.title, box.x + 10, y0, "#f4d03f"); y0 += 16; }
          for (var i = 0; i < choice.items.length; i++) {
            var it = choice.items[i];
            T.draw(ctx, it.label, box.x + 20, y0 + i * 16, it.disabled ? "#5b5a66" : "#f4f1e8");
            if (i === choice.index) G.cursor(ctx, box.x + 11, y0 + i * 16 + 1, "#f4d03f");
          }
        }
      },
      /* テスト・外部用 */
      skip: function () { if (page) page.shown = page.curTotal; },
      end: function () { page = null; choice = null; finish(result); },
      state: function () { return { pc: pc, page: page ? page.cur.join("\n") : null, choice: choice ? choice.items.map(function (c) { return c.label; }) : null, index: choice ? choice.index : -1 }; },
      choose: function (i) { if (choice) { choice.index = i; I.press("ok"); } }
    };
    function choiceBox() {
      var maxW = 0;
      choice.items.forEach(function (it) { maxW = Math.max(maxW, T.measure(it.label)); });
      if (choice.title) maxW = Math.max(maxW, T.measure(choice.title) - 10);
      var w = maxW + 40, h = choice.items.length * 16 + 20 + (choice.title ? 16 : 0);
      var x = X + W - w - 4, y = Y - h - 2;
      if (!page) { x = Math.round((NT.W - w) / 2); y = Math.round((NT.H - h) / 2); }
      return { x: x, y: y, w: w, h: h };
    }
    return scene;
  };
})();

/* 汎用カーソルメニュー（オーバーレイ）。items: [{label, value, disabled, note}] */
(function () {
  "use strict";
  var NT = window.NT;
  var T = NT.Text, G = NT.Gfx, I = NT.Input;

  /* opts: {x,y,w, title, items, index, cancelable, onSelect(item,index), onCancel(), onChange(item), draw(ctx) 追加描画, compact, cols} */
  NT.Menu = function (opts) {
    var m = {
      id: "MENU", opaque: false,
      x: opts.x, y: opts.y, w: opts.w || 120,
      items: opts.items || [],
      index: opts.index || 0,
      cancelable: opts.cancelable !== false,
      title: opts.title || null,
      lh: opts.lh || 16,
      pad: 10
    };
    var rows = m.items.length + (m.title ? 1 : 0);
    m.h = opts.h || (rows * m.lh + m.pad * 2 - 2);
    if (m.x === undefined) m.x = Math.round((NT.W - m.w) / 2);
    if (m.y === undefined) m.y = Math.round((NT.H - m.h) / 2);
    m.rowY = function (i) { return m.y + m.pad + (m.title ? m.lh : 0) + i * m.lh - 2; };

    function move(d) {
      var n = m.items.length; if (!n) return;
      var i = m.index, guard = 0;
      do { i = (i + d + n) % n; guard++; } while (m.items[i].disabled && guard <= n);
      if (i !== m.index) { m.index = i; NT.Audio.play("cursor"); if (opts.onChange) opts.onChange(m.items[i], i); }
    }
    m.select = function () {
      var it = m.items[m.index];
      if (!it || it.disabled) { NT.Audio.play("error"); return; }
      NT.Audio.play(it.sfx || "decide");
      if (opts.onSelect) opts.onSelect(it, m.index, m);
    };
    m.cancel = function () {
      if (!m.cancelable) return;
      NT.Audio.play("cancel");
      if (opts.onCancel) opts.onCancel(m); else NT.Scenes.pop(null);
    };
    m.update = function () {
      if (I.pressed("up")) move(-1);
      if (I.pressed("down")) move(1);
      if (I.pressed("ok")) { I.consume("ok"); m.select(); return; }
      if (I.pressed("cancel")) { I.consume("cancel"); m.cancel(); return; }
      var cl = I.clicks();
      for (var k = 0; k < cl.length; k++) {
        var c = cl[k];
        for (var i = 0; i < m.items.length; i++) {
          var ry = m.rowY(i);
          if (c.x >= m.x && c.x < m.x + m.w && c.y >= ry - 2 && c.y < ry + m.lh - 2) {
            if (m.index !== i) { m.index = i; if (opts.onChange) opts.onChange(m.items[i], i); }
            m.select(); return;
          }
        }
        if (m.cancelable && (c.x < m.x || c.x >= m.x + m.w || c.y < m.y || c.y >= m.y + m.h)) { m.cancel(); return; }
      }
    };
    m.draw = function (ctx) {
      G.frame(ctx, m.x, m.y, m.w, m.h);
      var ty = m.y + m.pad - 2;
      if (m.title) { T.draw(ctx, m.title, m.x + m.pad, ty, "#f4d03f"); }
      for (var i = 0; i < m.items.length; i++) {
        var it = m.items[i], ry = m.rowY(i);
        var col = it.disabled ? "#5b5a66" : (it.color || "#f4f1e8");
        T.draw(ctx, it.label, m.x + m.pad + 10, ry, col);
        if (it.note) T.drawRight(ctx, it.note, m.x + m.w - m.pad, ry, it.disabled ? "#5b5a66" : "#9aa0b4");
        if (i === m.index) G.cursor(ctx, m.x + m.pad + 1, ry + 1, "#f4d03f");
      }
      if (opts.draw) opts.draw(ctx, m);
    };
    return m;
  };

  /* はい／いいえ の確認。onYes/onNo */
  NT.Confirm = function (text, onYes, onNo, opts) {
    opts = opts || {};
    var lines = T.wrap(text, 240);
    var h = lines.length * 16 + 16 * 2 + 24;
    var w = 264, x = Math.round((NT.W - w) / 2), y = opts.y !== undefined ? opts.y : Math.round((NT.H - h) / 2);
    var items = [{ label: opts.noLabel || "いいえ", value: false }, { label: opts.yesLabel || "はい", value: true }];
    if (opts.yesFirst) items.reverse();
    var m = NT.Menu({
      x: x, y: y, w: w, h: h, items: items, index: opts.defaultYes ? items.findIndex(function (i) { return i.value; }) : items.findIndex(function (i) { return !i.value; }),
      cancelable: opts.cancelable !== false,
      onSelect: function (it) { NT.Scenes.pop(it.value); if (it.value) { if (onYes) onYes(); } else if (onNo) onNo(); },
      onCancel: function () { NT.Scenes.pop(false); if (onNo) onNo(); }
    });
    m.id = "CONFIRM";
    m.rowY = function (i) { return y + 10 + lines.length * 16 + 8 + i * 16; };
    var baseDraw = m.draw;
    m.draw = function (ctx) {
      G.frame(ctx, x, y, w, h);
      T.drawLines(ctx, lines, x + 12, y + 10, "#f4f1e8");
      for (var i = 0; i < items.length; i++) {
        var ry = m.rowY(i);
        T.draw(ctx, items[i].label, x + 12 + 10, ry, "#f4f1e8");
        if (i === m.index) G.cursor(ctx, x + 12 + 1, ry + 1, "#f4d03f");
      }
      void baseDraw;
    };
    return m;
  };

  /* 1行メッセージ（OK で閉じる）*/
  NT.Notice = function (text, onClose, opts) {
    opts = opts || {};
    var lines = T.wrap(text, 272);
    var h = lines.length * 16 + 24, w = 296, x = 12, y = opts.y !== undefined ? opts.y : NT.H - h - 10;
    var t = 0;
    return {
      id: "NOTICE", opaque: false,
      update: function (dt) {
        t += dt;
        if (I.pressed("ok") || I.pressed("cancel") || I.clicks().length) { I.consume("ok"); I.consume("cancel"); NT.Scenes.pop(); if (onClose) onClose(); }
      },
      draw: function (ctx) {
        G.frame(ctx, x, y, w, h);
        T.drawLines(ctx, lines, x + 12, y + 10, opts.color || "#f4f1e8");
        if ((t % 1000) < 500) G.nextMark(ctx, x + w - 16, y + h - 9, "#f4d03f");
      }
    };
  };
})();
</script>

//# sourceURL=src/js/22_inputbox.js
/* 日本語入力。canvas 上に本物の input/textarea を重ねる（IME を正しく扱うため）
   NT.InputBox.open({x,y,w,h, value, maxLen, multiline, placeholder, title, onDone(value|null)}) */
(function () {
  "use strict";
  var NT = window.NT;
  var T = NT.Text, G = NT.Gfx;
  var B = NT.InputBox = { active: null };

  function ensureOverlay() { return document.getElementById("overlay"); }

  B.open = function (o) {
    if (B.active) B.close(null);
    var ov = ensureOverlay();
    var el = document.createElement(o.multiline ? "textarea" : "input");
    el.className = o.multiline ? "nt-textarea" : "nt-input";
    if (!o.multiline) { el.type = "text"; el.autocomplete = "off"; el.autocapitalize = "off"; el.spellcheck = false; }
    el.value = o.value || "";
    el.placeholder = o.placeholder || "";
    el.setAttribute("aria-label", o.title || "入力");
    var maxLen = o.maxLen || 40;
    var composing = false, lastCompEnd = 0;
    var top = o.title ? 26 : 10, inputH = o.multiline ? 16 * (o.rows || 3) : 16;
    var frame = { x: o.x, y: o.y, w: o.w, h: o.h || (top + inputH + 30) };
    var inner = { x: frame.x + 12, y: frame.y + top, w: frame.w - 24, h: inputH };
    function place() {
      var s = NT.Screen.cssScale;
      el.style.left = (inner.x * s) + "px"; el.style.top = (inner.y * s) + "px";
      el.style.width = (inner.w * s) + "px"; el.style.height = (inner.h * s) + "px";
    }
    place();
    ov.appendChild(el);
    NT.Input.typing = true;
    var done = false;
    function finish(v) {
      if (done) return; done = true;
      NT.Input.typing = false;
      if (el.parentNode) el.parentNode.removeChild(el);
      B.active = null;
      try { NT.Screen.canvas.focus({ preventScroll: true }); } catch (e) { /* 無視 */ }
      window.removeEventListener("resize", place);
      if (o.onDone) o.onDone(v);
    }
    function clampLen() {
      var g = NT.Util.graphemes(el.value);
      if (g.length > maxLen) { el.value = g.slice(0, maxLen).join(""); }
    }
    el.addEventListener("compositionstart", function () { composing = true; });
    el.addEventListener("compositionend", function () { composing = false; lastCompEnd = performance.now(); clampLen(); });
    el.addEventListener("input", function () { if (!composing) clampLen(); });
    el.addEventListener("keydown", function (e) {
      e.stopPropagation();
      if (e.isComposing || e.keyCode === 229 || composing) return;
      if (performance.now() - lastCompEnd < 50 && e.key === "Enter") return; /* Safari の順序対策 */
      if (e.key === "Enter" && !(o.multiline && e.shiftKey)) { e.preventDefault(); NT.Audio.play("decide"); finish(el.value.normalize("NFC").trim()); }
      else if (e.key === "Escape") { e.preventDefault(); NT.Audio.play("cancel"); finish(null); }
      else if (e.key === "Tab") { e.preventDefault(); }
    });
    el.addEventListener("keyup", function (e) { e.stopPropagation(); });
    window.addEventListener("resize", place);
    B.active = { el: el, frame: frame, inner: inner, title: o.title, maxLen: maxLen, finish: finish, hint: o.hint };
    setTimeout(function () { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }, 0);
    return B.active;
  };
  B.close = function (v) { if (B.active) B.active.finish(v); };
  B.setValue = function (v) { if (B.active) { B.active.el.value = v; } };
  B.submit = function () { if (B.active) B.active.finish(B.active.el.value.normalize("NFC").trim()); };
  /* 枠と残り文字数を canvas に描く（シーン側の draw から呼ぶ） */
  B.draw = function (ctx) {
    var a = B.active; if (!a) return;
    G.frame(ctx, a.frame.x, a.frame.y, a.frame.w, a.frame.h);
    if (a.title) T.draw(ctx, a.title, a.frame.x + 12, a.frame.y + 8, "#f4d03f");
    var n = NT.Util.gLen(a.el.value);
    T.drawRight(ctx, n + "/" + a.maxLen, a.frame.x + a.frame.w - 12, a.frame.y + a.frame.h - 20, "#9aa0b4");
    var hint = a.hint || (a.el.tagName === "TEXTAREA" ? "Enter できめる　Shift+Enter で改行　Esc でやめる" : "Enter できめる　Esc でやめる");
    T.draw(ctx, hint, a.frame.x + 12, a.frame.y + a.frame.h - 20, "#5b5a66");
  };
})();
</script>

//# sourceURL=src/js/30_scene_boot.js
/* 起動画面。NETTA の肉球 → NETTA BOY → 本体チェック。約4秒、いつでもスキップ可 */
(function () {
  "use strict";
  var NT = window.NT;
  var T = NT.Text, G = NT.Gfx, I = NT.Input;

  NT.SceneBoot = function (opts) {
    opts = opts || {};
    var t = 0, stage = 0, powered = false, finished = false, typed = 0;
    var LINES = ["PAW CHECK ........ OK", "MEMORY  3 SLOT ... OK", "MEMORY CARD ...... ---", "", "LICENSED BY NETTA GAME-BU", "(C) 2026 NETTA GAME-BU"];
    var rng = NT.Util.rng(7);
    var noise = [];
    for (var i = 0; i < 200; i++) noise.push([Math.floor(rng() * NT.W), Math.floor(rng() * NT.H)]);
    var sfxBoot = false, sfxBrand = false, sfxCart = false;

    function finish() {
      if (finished) return;
      finished = true;
      if (opts.onDone) opts.onDone();
    }
    return {
      id: "BOOT", opaque: true,
      enter: function () { t = 0; },
      update: function (dt) {
        if (!powered) {
          if (I.anyKey()) { powered = true; NT.Audio.unlock(); t = 0; }
          return;
        }
        t += dt;
        if (I.anyKey() && t > 200) { finish(); return; }
        if (t > 150 && !sfxBoot) { sfxBoot = true; NT.Audio.play("boot"); }
        if (t > 1300 && !sfxBrand) { sfxBrand = true; NT.Audio.play("open"); }
        if (t > 2600) typed = Math.min(LINES.join("\n").length, Math.floor((t - 2600) / 14));
        if (t > 4300 && !sfxCart) { sfxCart = true; NT.Audio.play("cart"); }
        if (t > 4700) finish();
      },
      draw: function (ctx) {
        NT.Screen.clear("#000");
        var reduce = NT.Settings.get("reduceMotion");
        if (!powered) {
          /* 電源待ち：暗い画面に PRESS ANY KEY */
          ctx.fillStyle = "#07070b"; ctx.fillRect(0, 0, NT.W, NT.H);
          if ((Math.floor(performance.now() / 600) % 2) === 0 || reduce) T.drawCenter(ctx, "PRESS ANY KEY", NT.W / 2, 128, "#9aa0b4");
          T.drawCenter(ctx, "でんげんを いれる", NT.W / 2, 148, "#5b5a66");
          G.paw(ctx, NT.W / 2, 96, 1.4, "#3a3444");
          return;
        }
        /* 段階1：点灯の横線 → ノイズ → 肉球 + NETTA（0–1200ms） */
        if (t < 1200) {
          if (t < 160 && !reduce) {
            var h = Math.max(1, Math.round((t / 160) * NT.H));
            ctx.fillStyle = "#e8e8f0"; ctx.fillRect(0, (NT.H - h) / 2, NT.W, h);
            return;
          }
          if (t < 300 && !reduce) {
            ctx.fillStyle = "#101014"; ctx.fillRect(0, 0, NT.W, NT.H);
            ctx.fillStyle = "#9aa0b4";
            for (var i = 0; i < noise.length; i++) { var p = noise[(i + Math.floor(t)) % noise.length]; ctx.fillRect(p[0], (p[1] + Math.floor(t * 3)) % NT.H, 2, 1); }
            return;
          }
          var k = NT.Util.clamp((t - 300) / 500, 0, 1), e = NT.Util.easeOut(k);
          var py = reduce ? 96 : Math.round(-30 + (96 + 30) * e);
          G.paw(ctx, NT.W / 2, py, 2.2, "#f4d03f");
          if (t > 700) T.drawCenter(ctx, "NETTA", NT.W / 2, 134, "#f4f1e8", { head: true, size: 16 });
          return;
        }
        /* 段階2：ブランドマーク（1200–2600ms） */
        if (t < 2600) {
          var k2 = NT.Util.clamp((t - 1200) / 400, 0, 1);
          drawHeadphoneCat(ctx, NT.W / 2, 84, k2);
          var label = "NETTA BOY";
          var n = Math.floor(label.length * NT.Util.clamp((t - 1500) / 400, 0, 1));
          T.drawCenter(ctx, label, NT.W / 2, 150, "#f4f1e8", { head: true, size: 16, limit: n });
          if (t > 2100) T.drawCenter(ctx, "MAX 10 MEGA QUEST SPEC", NT.W / 2, 176, "#9aa0b4");
          if (t > 2300) T.drawCenter(ctx, "GAME-BU", NT.W / 2, 194, "#f4d03f");
          return;
        }
        /* 段階3：本体チェックのタイプ表示（2600–4700ms） */
        var all = LINES.join("\n"), shown = all.slice(0, typed).split("\n");
        for (var li = 0; li < shown.length; li++) T.draw(ctx, shown[li], 40, 60 + li * 18, li >= 4 ? "#9aa0b4" : "#7dffb0");
        if ((Math.floor(t / 250) % 2) === 0 && typed < all.length) { var lastLine = shown[shown.length - 1] || ""; ctx.fillStyle = "#7dffb0"; ctx.fillRect(40 + T.measure(lastLine), 60 + (shown.length - 1) * 18, 6, 12); }
        if (t > 4300) G.fade(ctx, (t - 4300) / 400, "255,255,255");
      },
      skip: finish,
      power: function () { if (!powered) { powered = true; NT.Audio.unlock(); t = 0; } }
    };
  };

  /* ヘッドホンの猫（ゲーム部ロゴの簡略版） */
  function drawHeadphoneCat(ctx, cx, cy, k) {
    var r = 26 * k;
    if (r < 1) return;
    ctx.fillStyle = "#cdbdec";
    ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.86, 0, 0, Math.PI * 2); ctx.fill();
    /* 耳 */
    ctx.beginPath(); ctx.moveTo(cx - r * 0.85, cy - r * 0.3); ctx.lineTo(cx - r * 0.6, cy - r * 1.25); ctx.lineTo(cx - r * 0.2, cy - r * 0.75); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + r * 0.85, cy - r * 0.3); ctx.lineTo(cx + r * 0.6, cy - r * 1.25); ctx.lineTo(cx + r * 0.2, cy - r * 0.75); ctx.closePath(); ctx.fill();
    /* ヘッドホン */
    ctx.strokeStyle = "#2ef2ff"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy - r * 0.1, r * 1.05, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.fillStyle = "#2ef2ff";
    ctx.fillRect(cx - r * 1.2, cy - r * 0.35, r * 0.3, r * 0.7); ctx.fillRect(cx + r * 0.9, cy - r * 0.35, r * 0.3, r * 0.7);
    /* 目と口 */
    ctx.fillStyle = "#1d1b2e";
    ctx.fillRect(cx - r * 0.45, cy - r * 0.1, r * 0.22, r * 0.3); ctx.fillRect(cx + r * 0.23, cy - r * 0.1, r * 0.22, r * 0.3);
    ctx.fillRect(cx - r * 0.1, cy + r * 0.3, r * 0.2, r * 0.08);
    ctx.fillStyle = "#f4afc4"; ctx.fillRect(cx - r * 0.7, cy + r * 0.2, r * 0.2, r * 0.1); ctx.fillRect(cx + r * 0.5, cy + r * 0.2, r * 0.2, r * 0.1);
    /* 肉球 */
