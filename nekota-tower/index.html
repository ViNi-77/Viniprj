/* きろく（セーブスロット）の選択。mode: 'load' | 'save' | 'new' */
(function () {
  "use strict";
  var NT = window.NT;
  var T = NT.Text, G = NT.Gfx, I = NT.Input, TX = function () { return NT.DATA.TEXT.slot; };

  NT.SceneSlot = function (opts) {
    var mode = opts.mode, index = 0, slots = [], suspend = null, askedSuspend = false, note = null;
    function readAll() {
      slots = [];
      for (var n = 1; n <= 3; n++) {
        var r = NT.Storage.readSlot(n);
        slots.push(r && r.rec ? r.rec : null);
      }
      var s = NT.Storage.readSuspend();
      suspend = s && s.rec ? s.rec : null;
    }
    function rowY(i) { return 40 + i * 52; }
    function pick(i) {
      var rec = slots[i], n = i + 1;
      if (mode === "load") {
        if (!rec) { NT.Audio.play("error"); return; }
        NT.Audio.play("decide");
        NT.Scenes.pop({ slot: n, rec: rec });
        if (opts.onPick) opts.onPick(n, rec);
        return;
      }
      /* save / new：上書き確認 */
      var go = function () { NT.Scenes.pop({ slot: n }); if (opts.onPick) opts.onPick(n, rec); };
      if (rec) { NT.Audio.play("decide"); NT.Scenes.push(NT.Confirm(NT.Util.fmt(TX().overwrite, { n: n }), go, null, { y: 150 })); }
      else { NT.Audio.play("decide"); go(); }
    }
    var scene = {
      id: "SLOT", opaque: true,
      enter: function () {
        readAll();
        if (mode === "load") { for (var i = 0; i < 3; i++) if (slots[i]) { index = i; break; } }
        if (mode === "save" && NT.State.slot) index = NT.State.slot - 1;
        if (mode === "load" && suspend && !askedSuspend) {
          askedSuspend = true;
          NT.Scenes.push(NT.Confirm(TX().suspend, function () {
            NT.Scenes.pop({ slot: 0, rec: suspend });
            if (opts.onPick) opts.onPick(0, suspend);
          }, function () { NT.Storage.clearSuspend(); suspend = null; }, { y: 150 }));
        }
        if (!NT.Storage.available) note = NT.DATA.TEXT.save.fail;
      },
      resume: function () { readAll(); },
      update: function () {
        if (I.pressed("up")) { index = (index + 2) % 3; NT.Audio.play("cursor"); }
        if (I.pressed("down")) { index = (index + 1) % 3; NT.Audio.play("cursor"); }
        if (I.pressed("ok")) { I.consume("ok"); pick(index); return; }
        if (I.pressed("cancel")) { I.consume("cancel"); NT.Audio.play("cancel"); NT.Scenes.pop(null); if (opts.onCancel) opts.onCancel(); return; }
        var cl = I.clicks();
        for (var k = 0; k < cl.length; k++) for (var i = 0; i < 3; i++) if (cl[k].y >= rowY(i) && cl[k].y < rowY(i) + 46) { index = i; pick(i); return; }
      },
      draw: function (ctx) {
        NT.Screen.clear("#070716");
        T.drawCenter(ctx, TX().title, NT.W / 2, 14, "#f4d03f");
        for (var i = 0; i < 3; i++) {
          var y = rowY(i), rec = slots[i];
          G.frame(ctx, 16, y, 288, 46, { innerColor: i === index ? "#f4d03f" : "#3a3444" });
          T.draw(ctx, "きろく " + (i + 1), 30, y + 8, "#9aa0b4");
          if (rec) {
            var st = rec.state;
            T.draw(ctx, st.name, 92, y + 8, "#f4f1e8");
            T.draw(ctx, st.title, 92 + T.measure(st.name) + 8, y + 8, "#f4afc4");
            T.draw(ctx, TX().marks + " " + st.marks + "/10", 30, y + 26, "#f4d03f");
            T.draw(ctx, TX().play + " " + NT.State.playTimeText(rec.playMs || 0), 130, y + 26, "#9aa0b4");
            T.drawRight(ctx, (rec.savedAt || "").slice(0, 10), 292, y + 26, "#5b5a66");
            T.drawRight(ctx, st.floor ? st.floor + "F" : "", 292, y + 8, "#9aa0b4");
          } else {
            T.draw(ctx, TX().empty, 92, y + 8, "#5b5a66");
          }
          if (i === index) G.cursor(ctx, 20, y + 10, "#f4d03f");
        }
        var ml = T.wrap(note || NT.DATA.TEXT.save.memoryNote, 296);
        T.drawLines(ctx, ml, 12, 202, note ? "#f4afc4" : "#5b5a66", undefined, 14);
      }
    };
    return scene;
  };
})();
</script>

/* タイルマップ。衝突判定と描画 */
(function () {
  "use strict";
  var NT = window.NT;
  var G = NT.Gfx, TILE = NT.TILE;
  var M = NT.Tilemap = {};
  var map = null, cols = 0, rows = 0, grid = [];
  var CH = { "#": G.T.WALL, "=": G.T.WALLTOP, ".": G.T.FLOOR, ",": G.T.CARPET, "S": G.T.STAIRS_DOWN, "s": G.T.STAIRS_UP, "E": G.T.ELEVATOR, "|": G.T.ELEVATOR_SHAFT, "M": G.T.STONE, "D": G.T.DOOR, "d": G.T.DOOR_OPEN, "B": G.T.SHELF, "W": G.T.WINDOW, "F": G.T.FLOWER_POT, "@": G.T.CARPET, "x": G.T.FLOOR, " ": G.T.VOID };
  var SOLID = { "#": 1, "=": 1, "|": 1, "M": 1, "B": 1, "W": 1, "F": 1, " ": 1 };

  M.init = function () {
    map = NT.DATA.MAP;
    cols = map.cols; rows = map.rows.length;
    grid = map.rows.map(function (r) { return r.split(""); });
    M.cols = cols; M.rows = rows;
    M.pxW = cols * TILE; M.pxH = rows * TILE;
    M.spawn = null;
    for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) if (grid[y][x] === "@") M.spawn = { x: x, y: y };
  };
  M.at = function (x, y) { if (x < 0 || y < 0 || x >= cols || y >= rows) return " "; return grid[y][x]; };
  M.set = function (x, y, ch) { if (x >= 0 && y >= 0 && x < cols && y < rows) grid[y][x] = ch; };
  M.floorAt = function (y) { return map.floorAt(y); };
  M.bandY = function (f) { return map.bandY(f); };
  M.solid = function (x, y) {
    var ch = M.at(x, y);
    if (ch === "D") return !(NT.State.cur && NT.State.cur.flags.doorOpen);
    if (SOLID[ch]) return true;
    if (NT.Entities && NT.Entities.at(x, y)) return true;
    return false;
  };
  M.isFlower = function (x, y) { return M.at(x, y) === "F"; };
  /* 階の鉢の一覧 */
  M.potsOf = function (f) { return (map.cfg[f] && map.cfg[f].pots) || []; };
  /* 描画。camera: {x,y}（px、左上） */
  M.draw = function (ctx, cam) {
    var x0 = Math.floor(cam.x / TILE), y0 = Math.floor(cam.y / TILE);
    var x1 = Math.ceil((cam.x + NT.W) / TILE), y1 = Math.ceil((cam.y + NT.H) / TILE);
    var flowers = (NT.State.cur && NT.State.cur.flowers) || {};
    for (var y = y0; y <= y1; y++) {
      if (y < 0 || y >= rows) continue;
      var f = map.floorAt(y);
      var ts = G.tileset(f, map.palettes[f]);
      for (var x = x0; x <= x1; x++) {
        if (x < 0 || x >= cols) continue;
        var ch = grid[y][x];
        var idx = CH[ch] === undefined ? G.T.FLOOR : CH[ch];
        if (ch === "D" && NT.State.cur && NT.State.cur.flags.doorOpen) idx = G.T.DOOR_OPEN;
        if (ch === "F") {
          var list = flowers[f] || [];
          for (var i = 0; i < list.length; i++) if (list[i][0] === x && list[i][1] === y) { idx = G.T.FLOWER; break; }
        }
        var px = x * TILE - cam.x, py = y * TILE - cam.y;
        if (idx !== G.T.FLOOR && idx !== G.T.CARPET && idx !== G.T.WALL && idx !== G.T.WALLTOP && idx !== G.T.VOID && idx !== G.T.ELEVATOR_SHAFT) G.drawTile(ctx, ts, G.T.FLOOR, px, py);
        G.drawTile(ctx, ts, idx, px, py);
      }
    }
  };
})();
</script>

/* カメラ。主人公を中央に置き、マップの端で止める。エレベーターは縦にパンする */
(function () {
  "use strict";
  var NT = window.NT;
  var C = NT.Camera = { x: 0, y: 0 };
  var tween = null;
  C.HUD = 16; /* 上部 HUD の高さ（px）*/

  C.clamp = function () {
    C.x = NT.Util.clamp(C.x, 0, Math.max(0, NT.Tilemap.pxW - NT.W));
    C.y = NT.Util.clamp(C.y, -C.HUD, Math.max(-C.HUD, NT.Tilemap.pxH - NT.H + 0));
  };
  C.center = function (px, py) {
    C.x = Math.round(px - NT.W / 2);
    C.y = Math.round(py - (NT.H + C.HUD) / 2);
    C.clamp();
  };
  C.follow = function (px, py) {
    if (tween) return;
    C.center(px, py);
  };
  C.panTo = function (px, py, ms, onDone) {
    var sx = C.x, sy = C.y;
    var tx = Math.round(px - NT.W / 2), ty = Math.round(py - (NT.H + C.HUD) / 2);
    tx = NT.Util.clamp(tx, 0, Math.max(0, NT.Tilemap.pxW - NT.W));
    ty = NT.Util.clamp(ty, -C.HUD, Math.max(-C.HUD, NT.Tilemap.pxH - NT.H));
    tween = { sx: sx, sy: sy, tx: tx, ty: ty, t: 0, ms: ms || 600, onDone: onDone };
  };
  C.update = function (dt) {
    if (!tween) return;
    tween.t += dt;
    var k = NT.Util.easeInOut(NT.Util.clamp(tween.t / tween.ms, 0, 1));
    C.x = Math.round(NT.Util.lerp(tween.sx, tween.tx, k));
    C.y = Math.round(NT.Util.lerp(tween.sy, tween.ty, k));
    if (tween.t >= tween.ms) { var cb = tween.onDone; tween = null; if (cb) cb(); }
  };
  C.busy = function () { return !!tween; };
})();
</script>

//# sourceURL=src/js/42_player.js
/* ねこ太の移動。タイル単位で歩き、見た目は揺れフレームで表現する */
(function () {
  "use strict";
  var NT = window.NT;
  var TILE = NT.TILE, I = NT.Input, U = NT.Util;
  var P = NT.Player = { x: 0, y: 0, px: 0, py: 0, dir: "down", moving: false, tx: 0, ty: 0, phase: 0, locked: false, path: null };
  var stepSfx = 0;

  P.place = function (x, y, dir) {
    P.x = x; P.y = y; P.px = x * TILE; P.py = y * TILE; P.dir = dir || P.dir; P.moving = false; P.path = null;
    if (NT.State.cur) NT.State.cur.pos = { x: x, y: y, dir: P.dir };
  };
  P.facing = function () {
    var d = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] }[P.dir];
    return { x: P.x + d[0], y: P.y + d[1] };
  };
  P.tryMove = function (dx, dy) {
    if (P.moving || P.locked) return false;
    P.dir = dx > 0 ? "right" : dx < 0 ? "left" : dy > 0 ? "down" : "up";
    var nx = P.x + dx, ny = P.y + dy;
    if (NT.Tilemap.solid(nx, ny)) { return false; }
    P.tx = nx; P.ty = ny; P.moving = true;
    return true;
  };
  P.update = function (dt) {
    var speed = I.held("dash") ? 4 : 2;
    if (!P.moving) {
      if (!P.locked) {
        var ax = I.axis();
        /* 一瞬だけ押された場合も1歩ぶんとして扱う */
        if (!ax.x && !ax.y) {
          ax.x = (I.pressed("right") ? 1 : 0) - (I.pressed("left") ? 1 : 0);
          ax.y = (I.pressed("down") ? 1 : 0) - (I.pressed("up") ? 1 : 0);
        }
        if (P.path && P.path.length) {
          var n = P.path[0];
          if (!P.tryMove(n.x - P.x, n.y - P.y)) P.path = null; else P.path.shift();
        } else if (ax.x || ax.y) {
          P.path = null;
          if (ax.x && !P.tryMove(ax.x, 0) && ax.y) P.tryMove(0, ax.y);
          else if (!ax.x && ax.y) P.tryMove(0, ax.y);
        }
      }
      if (!P.moving) { P.phase += dt * 0.0022; return; }
    }
    var gx = P.tx * TILE, gy = P.ty * TILE;
    if (P.px < gx) P.px = Math.min(gx, P.px + speed); else if (P.px > gx) P.px = Math.max(gx, P.px - speed);
    if (P.py < gy) P.py = Math.min(gy, P.py + speed); else if (P.py > gy) P.py = Math.max(gy, P.py - speed);
    P.phase += dt * 0.011;
    stepSfx += dt;
    if (stepSfx > 220) { stepSfx = 0; NT.Audio.play("step"); }
    if (P.px === gx && P.py === gy) {
      P.x = P.tx; P.y = P.ty; P.moving = false;
      if (NT.State.cur) NT.State.cur.pos = { x: P.x, y: P.y, dir: P.dir };
      if (P.onArrive) P.onArrive(P.x, P.y);
    }
  };
  P.spriteKey = function () {
    var f = 0;
    if (P.moving) f = Math.sin(P.phase) > 0.3 ? 1 : Math.sin(P.phase) < -0.3 ? -1 : 0;
    return "nekota:" + P.dir + ":" + f;
  };
  P.draw = function (ctx, cam) {
    var bob = P.moving ? Math.round(Math.abs(Math.sin(P.phase)) * 2) : 0;
    var x = Math.round(P.px - cam.x + TILE / 2), y = Math.round(P.py - cam.y + TILE - bob + 2);
    NT.Sprites.draw(ctx, P.spriteKey(), x, y);
  };
  /* クリック移動：幅優先で経路を引く（短い距離だけ） */
  P.walkTo = function (tx, ty) {
    if (P.locked) return;
    if (NT.Tilemap.solid(tx, ty)) {
      /* 固い所をクリックしたら、その手前まで */
      var cand = [[tx, ty + 1], [tx, ty - 1], [tx - 1, ty], [tx + 1, ty]].filter(function (c) { return !NT.Tilemap.solid(c[0], c[1]); });
      if (!cand.length) return;
      cand.sort(function (a, b) { return (Math.abs(a[0] - P.x) + Math.abs(a[1] - P.y)) - (Math.abs(b[0] - P.x) + Math.abs(b[1] - P.y)); });
      tx = cand[0][0]; ty = cand[0][1];
    }
    var start = { x: P.x, y: P.y }, key = function (p) { return p.x + "," + p.y; };
    var prev = {}, q = [start], seen = {}; seen[key(start)] = true;
    var found = null, limit = 2000;
    while (q.length && limit-- > 0) {
      var c = q.shift();
      if (c.x === tx && c.y === ty) { found = c; break; }
      [[0, 1], [0, -1], [1, 0], [-1, 0]].forEach(function (d) {
        var n = { x: c.x + d[0], y: c.y + d[1] }, k = key(n);
        if (seen[k] || NT.Tilemap.solid(n.x, n.y)) return;
        seen[k] = true; prev[k] = c; q.push(n);
      });
    }
    if (!found) return;
    var path = [], cur = found;
    while (cur && !(cur.x === start.x && cur.y === start.y)) { path.unshift(cur); cur = prev[key(cur)]; }
    P.path = path;
  };
})();
</script>

/* NPC と仕掛け。マップ上の座標に変換して持つ */
(function () {
  "use strict";
  var NT = window.NT;
  var TILE = NT.TILE;
  var E = NT.Entities = { list: [] };
  var byPos = {};

  E.init = function () {
    E.list = NT.DATA.ENTITIES.map(function (d) {
      var e = NT.Util.assign({}, d);
      e.wx = d.x; e.wy = NT.DATA.MAP.bandY(d.floor) + d.y;
      e.bob = 0; e.dir = d.face || "down";
      return e;
    });
    byPos = {};
    E.list.forEach(function (e) { byPos[e.wx + "," + e.wy] = e; });
  };
  E.at = function (x, y) { return byPos[x + "," + y] || null; };
  E.byId = function (id) { for (var i = 0; i < E.list.length; i++) if (E.list[i].id === id) return E.list[i]; return null; };
  E.visible = function (e) {
    if (e.id === "boss") return !!(NT.State.cur && NT.State.cur.flags.doorOpen);
    return true;
  };
  E.update = function (dt) {
    E.list.forEach(function (e) { e.bob += dt; });
  };
  E.draw = function (ctx, cam) {
    var st = NT.State.cur;
    E.list.forEach(function (e) {
      if (!E.visible(e)) return;
      var px = e.wx * TILE - cam.x, py = e.wy * TILE - cam.y;
      if (px < -32 || py < -48 || px > NT.W + 32 || py > NT.H + 48) return;
      var hop = (e.hopUntil && e.hopUntil > NT.Loop.elapsed) ? -Math.round(Math.abs(Math.sin((e.hopUntil - NT.Loop.elapsed) / 60)) * 4) : 0;
      NT.Sprites.draw(ctx, e.sprite, px + TILE / 2, py + TILE + 2 + hop);
      /* クエストの状態を頭上に */
      if (e.quest && st) {
        var q = st.quests[e.quest] || {}, mark = null, col = "#f4d03f";
        if (q.status === "cleared") { mark = "●"; col = "#7dffb0"; }
        else if (NT.Quests && NT.Quests.isReportable(e.quest)) { mark = "!"; col = "#f4afc4"; }
        else if (q.status === "offered" && NT.DATA.QUESTS[e.quest] && NT.DATA.QUESTS[e.quest].implemented) { mark = "?"; }
        if (mark && ((e.bob % 900) < 650)) NT.Text.draw(ctx, mark, px + 5, py - 30 + hop, col, { shadow: true });
      }
    });
  };
  E.hop = function (id) { var e = E.byId(id); if (e) e.hopUntil = NT.Loop.elapsed + 360; };
})();
</script>

/* 塔の中を歩くシーン。HUD、話しかけ、石碑、エレベーター、扉、ゲーム内メニュー */
(function () {
  "use strict";
  var NT = window.NT;
  var T = NT.Text, G = NT.Gfx, I = NT.Input, TILE = NT.TILE, TX = function () { return NT.DATA.TEXT; };

  NT.SceneMap = function () {
    var fade = 1, fadeDir = -1, noteTimer = 0, noteText = null, lastFloor = 0, toast = null;
    var scene = {
      id: "MAP", opaque: true,
      enter: function () {
        var st = NT.State.cur;
        if (st.pos) NT.Player.place(st.pos.x, st.pos.y, st.pos.dir);
        else { var sp = NT.Tilemap.spawn; NT.Player.place(sp.x, sp.y, "down"); }
        NT.Camera.center(NT.Player.px + 8, NT.Player.py + 8);
        NT.Player.onArrive = onArrive;
        fade = 1; fadeDir = -1;
        lastFloor = NT.Tilemap.floorAt(NT.Player.y);
        showCalendarNote();
      },
      resume: function () { NT.Input.reset(); },
      update: function (dt) {
        NT.State.tick(dt);
        if (noteTimer > 0) noteTimer -= dt;
        NT.Camera.update(dt);
        if (NT.Camera.busy()) return;
        NT.Entities.update(dt);
        NT.Player.update(dt);
        NT.Camera.follow(NT.Player.px + 8, NT.Player.py + 8);
        var cl = I.clicks();
        if (cl.length && !NT.Player.locked) {
          var c = cl[0];
          if (c.y >= NT.Camera.HUD) {
            var tx = Math.floor((c.x + NT.Camera.x) / TILE), ty = Math.floor((c.y + NT.Camera.y) / TILE);
            var e = NT.Entities.at(tx, ty);
            var adj = Math.abs(tx - NT.Player.x) + Math.abs(ty - NT.Player.y) === 1;
            if (e && adj) { faceTo(tx, ty); interact(); } else NT.Player.walkTo(tx, ty);
          }
        }
        if (I.pressed("ok") && !NT.Player.moving) { I.consume("ok"); interact(); }
        if (I.pressed("menu")) { I.consume("menu"); if (!NT.Player.moving) openMenu(); }
        var f = NT.Tilemap.floorAt(NT.Player.y);
        if (f !== lastFloor) { lastFloor = f; scene.toast(f + "F"); }
      },
      draw: function (ctx) {
        NT.Screen.clear("#000");
        var cam = NT.Camera;
        NT.Tilemap.draw(ctx, cam);
        /* 描画順：y の小さい順（奥から） */
        var drawables = NT.Entities.list.filter(NT.Entities.visible).map(function (e) { return { y: e.wy, fn: function () { drawOne(ctx, cam, e); } }; });
        drawables.push({ y: NT.Player.py / TILE + 0.01, fn: function () { NT.Player.draw(ctx, cam); } });
        drawables.sort(function (a, b) { return a.y - b.y; });
        drawables.forEach(function (d) { d.fn(); });
        drawHUD(ctx);
        if (noteTimer > 0 && noteText) {
          var lines = T.wrap(noteText, 280);
          var h = lines.length * 16 + 12;
          G.frame(ctx, 8, NT.H - h - 6, 304, h, { inner: false });
          T.drawLines(ctx, lines, 20, NT.H - h, "#f4f1e8");
        }
        if (toast && toast.t > 0) { T.drawCenter(ctx, toast.text, NT.W / 2, 28, "#f4d03f", { head: true, size: 16, shadow: true }); toast.t -= 16; }
        if (fade > 0) { G.fade(ctx, fade); fade = Math.max(0, fade - 0.06); }
      },
      toast: function (text) { toast = { text: text, t: 1200 }; },
      note: function (text) { noteText = text; noteTimer = 3600; }
    };
    function drawOne(ctx, cam, e) {
      /* 43_entities.draw は一括描画なので、ここでは1体ずつ */
      var saveList = NT.Entities.list; NT.Entities.list = [e]; NT.Entities.draw(ctx, cam); NT.Entities.list = saveList;
    }
    function faceTo(tx, ty) {
      var dx = tx - NT.Player.x, dy = ty - NT.Player.y;
      NT.Player.dir = dx > 0 ? "right" : dx < 0 ? "left" : dy > 0 ? "down" : "up";
    }
    function interact() {
      var f = NT.Player.facing();
      var e = NT.Entities.at(f.x, f.y);
      if (e && NT.Entities.visible(e)) {
        e.dir = { down: "up", up: "down", left: "right", right: "left" }[NT.Player.dir];
        NT.Entities.hop(e.id);
        NT.Dialog.open(e.dialog, { npc: e });
        return;
      }
      var ch = NT.Tilemap.at(f.x, f.y);
      if (ch === "M") { NT.Flow.openSave(); return; }
      if (ch === "D" && !(NT.State.cur.flags.doorOpen)) { NT.Dialog.open("d.door"); return; }
      if (ch === "B") { NT.Dialog.open("d.shelf"); return; }
      if (ch === "W") { NT.Dialog.open("d.window"); return; }
      if (ch === "F") { NT.Dialog.open(NT.Tilemap.isFlower(f.x, f.y) && isBloomed(f.x, f.y) ? "d.flower" : "d.pot"); return; }
    }
    function isBloomed(x, y) {
      var fl = NT.State.cur.flowers || {}, f = NT.Tilemap.floorAt(y);
      return (fl[f] || []).some(function (p) { return p[0] === x && p[1] === y; });
    }
    function onArrive(x, y) {
      var ch = NT.Tilemap.at(x, y);
      if (ch === "E") { NT.Flow.openElevator(); }
      NT.State.touch();
    }
    function showCalendarNote() {
      var n = NT.Time.calendarNote();
      if (n) scene.note(n);
    }
    function drawHUD(ctx) {
      var st = NT.State.cur, hud = TX().hud;
      ctx.fillStyle = "rgba(0,0,0,.82)"; ctx.fillRect(0, 0, NT.W, 16);
      ctx.fillStyle = "#3a3444"; ctx.fillRect(0, 16, NT.W, 1);
      var f = NT.Tilemap.floorAt(NT.Player.y);
      T.draw(ctx, f + "F", 6, 2, "#f4d03f");
      var phase = NT.State.phase();
      var left = NT.State.daysLeft();
      var s = phase === "over" ? hud.over : NT.Util.fmt(hud.daysLeft, { n: left });
      T.draw(ctx, s, 34, 2, phase === "final" ? "#f4d03f" : "#f4f1e8");
      if (phase === "dec" || phase === "final") T.draw(ctx, NT.Util.fmt(hud.feel, { n: NT.State.feelDays() }), 34 + T.measure(s) + 8, 2, "#9aa0b4");
      var marks = NT.Util.fmt(hud.marks, { n: st.marks });
      T.drawRight(ctx, marks, NT.W - 18, 2, "#f4afc4");
      if (NT.State.dirty) T.draw(ctx, hud.unsaved, NT.W - 12, 2, "#f4d03f");
      if (phase === "final") { ctx.fillStyle = "#f4d03f"; ctx.fillRect(0, 17, NT.W, 1); }
    }
    function openMenu() {
      NT.Audio.play("open");
      var tx = TX();
      var items = [
        { label: "クエスト", value: "quests" },
        { label: tx.save.title, value: "save" },
        { label: tx.card.title, value: "card" },
        { label: tx.settings.title, value: "settings" },
        { label: tx.power.title, value: "power" },
        { label: tx.menu.close, value: "close" }
      ];
      NT.Scenes.push(NT.Menu({
        x: 180, y: 24, w: 132, items: items, title: NT.State.cur.name + "　" + NT.State.cur.title,
        onSelect: function (it) {
          if (it.value === "close") { NT.Scenes.pop(); return; }
          if (it.value === "quests") { NT.Scenes.pop(); NT.Flow.openQuestList(); }
          else if (it.value === "save") { NT.Scenes.pop(); NT.Flow.openSave(); }
          else if (it.value === "card") { NT.Scenes.pop(); NT.Flow.openCard(); }
          else if (it.value === "settings") { NT.Scenes.pop(); NT.Flow.openSettings(); }
          else if (it.value === "power") { NT.Scenes.pop(); NT.Flow.powerOff(); }
        }
      }));
    }
    return scene;
  };
})();
</script>

//# sourceURL=src/js/50_quests.js
/* クエストエンジン。状態の遷移、条件の評価、クリアの儀式 */
(function () {
  "use strict";
  var NT = window.NT;
  var Q = NT.Quests = {};
  var TX = function () { return NT.DATA.TEXT.quest; };

  Q.def = function (id) { return NT.DATA.QUESTS[id]; };
  /* 定義のリスト一覧（lists 優先、無ければ list を 1 件として扱う） */
  Q.lists = function (def) { return def.prep ? (def.prep.lists || (def.prep.list ? [def.prep.list] : [])) : []; };
  Q.listDef = function (def, kind) { var ls = Q.lists(def); for (var i = 0; i < ls.length; i++) if (ls[i].kind === kind) return ls[i]; return null; };
  Q.state = function (id) {
    var st = NT.State.cur;
    if (!st.quests[id]) st.quests[id] = { status: "offered" };
    var q = st.quests[id];
    if (!q.extras) q.extras = {};
    return q;
  };
  Q.status = function (id) { return Q.state(id).status; };

  Q.accept = function (id) {
    var q = Q.state(id);
    if (q.status !== "offered") return false;
    q.status = "accepted";
    q.acceptedKey = NT.Time.jstKey();
    q.plan = q.plan || { when: "", where: "", how: "", obstacle: "" };
    var def = Q.def(id);
    Q.lists(def).forEach(function (L) { q[L.kind] = q[L.kind] || []; });
    if (def.exec && def.exec.charms) q.charms = def.exec.charms;
    q.checks = q.checks || []; q.charmUsed = q.charmUsed || [];
    q.extras = q.extras || {};
    NT.State.addLog(id + ".accept", def.title);
    return true;
  };

  /* ---- 条件表 ---- */
  Q.today = function () { return NT.Time.jstKey(); };
  Q.entriesOf = function (q, kind, def) {
    if (kind === "*" ) { var all = []; Q.lists(def).forEach(function (L) { all = all.concat(q[L.kind] || []); }); return all; }
    return q[kind] || [];
  };
  Q.withFlag = function (q, spec, def) {
    var parts = spec.split(":"), kind = parts[0], flag = parts[1];
    return Q.entriesOf(q, kind, def).filter(function (e) { return !!e[flag + "Key"]; });
  };
  /* 旧データ互換：doneKey を持つ entries */
  Q.doneEntries = function (q) { return (q.entries || []).filter(function (e) { return e.doneKey; }); };
  /* 連続日数。きょう（またはきのう）から さかのぼる。お守りの日も数える */
  Q.streak = function (q) {
    var set = {};
    (q.checks || []).forEach(function (k) { set[k] = true; });
    (q.charmUsed || []).forEach(function (k) { set[k] = true; });
    var k = Q.today();
    if (!set[k]) k = NT.Time.prevKey(k);
    var n = 0, guard = 0;
    while (set[k] && guard++ < 400) { n++; k = NT.Time.prevKey(k); }
    return n;
  };
  Q.streakThrough = function (q, mmdd) {
    var year = NT.State.cur.year, end = year + "-" + mmdd;
    if (Q.today() < end) return false;
    var set = {};
    (q.checks || []).concat(q.charmUsed || []).forEach(function (k) { set[k] = true; });
    if (!q.declared) return false;
    var k = q.declared.startKey;
    var guard = 0;
    while (k <= end && guard++ < 400) { if (!set[k]) return false; k = NT.Time.nextKey(k); }
    return true;
  };
  Q.num = function (s) { if (s == null) return NaN; var m = String(s).replace(/,/g, "").match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; };
  Q.newRecord = function (q) {
    var rec = Q.num(q.extras && q.extras.record);
    if (isNaN(rec)) return false;
    return (q.attempts || []).some(function (a) { var v = Q.num(a.text); return !isNaN(v) && v > rec; });
  };
  var ATOMS = {
    doneCount: function (q, op, v) { return cmp(Q.doneEntries(q).length, op, v); },
    doneTag: function (q, tag) { return Q.doneEntries(q).some(function (e) { return e.tag === tag; }); },
    lesson: function (q) { return !!(q.lesson && q.lesson.trim()); },
    declared: function (q) { return !!q.declared; },
    streak: function (q, op, v) { return cmp(Q.streak(q), op, v); },
    reason: function (q) { return !!(q.declared && q.declared.reason && q.declared.reason.trim()); },
    streakThrough: function (q, mmdd) { return Q.streakThrough(q, mmdd); },
    flagCount: function (q, spec, n, def) { return Q.withFlag(q, spec, def).length >= n; },
    listCount: function (q, kind, n, def) { return Q.entriesOf(q, kind, def).length >= n; },
    extra: function (q, key) { return !!(q.extras && q.extras[key] && String(q.extras[key]).trim()); },
    extrasAll: function (q, keys) { return (keys || []).every(function (k) { return !!(q.extras && q.extras[k] && String(q.extras[k]).trim()); }); },
    timer: function (q, _, n) { return (q.timerDone || 0) >= n; },
    newRecord: function (q) { return Q.newRecord(q); }
  };
  function cmp(a, op, b) { return op === ">=" ? a >= b : op === ">" ? a > b : op === "==" ? a === b : op === "<=" ? a <= b : a < b; }
  Q.evalCond = function (q, c, def) {
    var fn = ATOMS[c[0]];
    if (!fn) return false;
    return !!fn(q, c[1], c[2], def);
  };
  /* [{label, ok}] */
  Q.conditions = function (id) {
    var def = Q.def(id), q = Q.state(id);
    return (def.clear || []).map(function (c) { return { label: c[3] || c[0], ok: Q.evalCond(q, c, def) }; });
  };
  Q.bonuses = function (id) {
    var def = Q.def(id), q = Q.state(id);
    return (def.bonus || []).map(function (c) { return { label: c[3] || c[0], ok: Q.evalCond(q, c, def) }; });
  };
  Q.isReportable = function (id) {
    var def = Q.def(id);
    if (!def || !def.implemented) return false;
    var q = Q.state(id);
    if (q.status === "cleared" || q.status === "offered") return false;
    return Q.conditions(id).every(function (c) { return c.ok; });
  };
  Q.progressText = function (id) {
    var q = Q.state(id), def = Q.def(id);
    if (!def.implemented) return TX().preparing;
    if (q.status === "cleared") return TX().cleared;
    if (q.status === "offered") return "";
    var cs = Q.conditions(id), n = cs.filter(function (c) { return c.ok; }).length;
    return n + "/" + cs.length;
  };

  /* ---- 実行コマンド ---- */
  Q.canCheckToday = function (q) {
    var st = NT.State.cur;
    if (st.flags.clockSuspect) return { ok: false, why: TX().frozen };
    if (!q.declared) return { ok: false, why: TX().needMore };
    var k = Q.today();
    if ((q.checks || []).indexOf(k) >= 0 || (q.charmUsed || []).indexOf(k) >= 0) return { ok: false, why: TX().checked };
    if (q.declared.startKey && k < q.declared.startKey) return { ok: false, why: TX().needMore };
    return { ok: true };
  };
  Q.checkToday = function (id) {
    var q = Q.state(id), can = Q.canCheckToday(q);
    if (!can.ok) return can;
    q.checks.push(Q.today());
    q.status = "doing";
    NT.State.addLog(id + ".check", Q.def(id).title);
    NT.Audio.play("item"); NT.Loop.freeze(4);
    return { ok: true, streak: Q.streak(q) };
  };
  Q.useCharm = function (id) {
    var q = Q.state(id);
    if (!q.declared) return { ok: false, why: TX().needMore };
    if (!(q.charms > 0)) return { ok: false, why: NT.Util.fmt(TX().charmLeft, { n: 0 }) };
    var k = Q.today();
    if (q.checks.indexOf(k) >= 0 || q.charmUsed.indexOf(k) >= 0) return { ok: false, why: TX().checked };
    q.charms--; q.charmUsed.push(k);
    NT.State.addLog(id + ".charm", "");
    NT.Audio.play("save");
    return { ok: true };
  };
  Q.declare = function (id, text, reason) {
    var q = Q.state(id);
    q.declared = { text: text, reason: reason || "", startKey: Q.today() };
    q.status = "doing";
    NT.State.addLog(id + ".declare", text);
    NT.Audio.play("accept"); NT.Loop.freeze(6);
  };
  /* 項目に印を付ける（汎用）。cmd.flag が 'done' なら doneKey */
  Q.markFlag = function (id, entry, cmd, value) {
    var q = Q.state(id), flag = cmd.flag || "done";
    entry[flag + "Key"] = Q.today();
    entry.undoUntil = NT.Loop.elapsed + 60000;
    entry.undoFlag = flag;
    if (cmd.input && cmd.input.field && value !== undefined) entry[cmd.input.field] = value;
    q.status = "doing";
    var vars = { text: entry.text, date: entry.date ? NT.Time.mmdd(entry.date).replace("-", "/") : "", value: value || "" };
    var msg = NT.Util.fmt(cmd.log || "{text}", vars);
    NT.State.addLog(id + "." + flag, msg);
    NT.Audio.play(cmd.sfx || "item"); NT.Loop.freeze(cmd.weight || 6);
    var m = NT.Scenes.find("MAP"); if (m) m.toast(msg);
    return msg;
  };
  Q.markDone = function (id, entry, cmd) { return Q.markFlag(id, entry, cmd, undefined); };
  Q.undo = function (id, entry) {
    var flag = entry.undoFlag || "done";
    if (!entry[flag + "Key"]) return false;
    entry[flag + "Key"] = null; entry.undoUntil = 0;
    NT.State.addLog(id + ".undo", entry.text);
    NT.Audio.play("cancel");
    return true;
  };
  /* 10分なにもしない の完了 */
  Q.whiteDone = function (id, seconds) {
    var q = Q.state(id);
    q.timerDone = (q.timerDone || 0) + 1;
    q.status = "doing";
    q.whiteLog = q.whiteLog || [];
    q.whiteLog.push({ k: Q.today(), sec: seconds });
    NT.State.addLog(id + ".white", seconds + "秒 なにもしなかった");
    NT.State.touch();
  };
  /* 日付の読み取り：'YYYY-MM-DD' / 'YYYY/M/D' / 'M/D'（きょうより前なら来年） */
  Q.parseDate = function (s) {
    s = String(s || "").trim().replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/[年月]/g, "/").replace(/日/g, "");
    var m, y, mo, d, today = Q.today();
    if ((m = /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/.exec(s))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else if ((m = /^(\d{1,2})[-\/](\d{1,2})$/.exec(s))) {
      mo = +m[1]; d = +m[2]; y = NT.Time.yearOf(today);
      var cand = y + "-" + NT.Util.pad2(mo) + "-" + NT.Util.pad2(d);
      if (cand < today) y++;
    } else return null;
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    var key = y + "-" + NT.Util.pad2(mo) + "-" + NT.Util.pad2(d);
    var chk = new Date(NT.Time.keyToUTC(key));
    if (chk.getUTCMonth() + 1 !== mo) return null;
    return key;
  };

  /* ---- クリアの儀式 ---- */
  Q.clear = function (id, reportText) {
    var st = NT.State.cur, q = Q.state(id), def = Q.def(id);
    if (!Q.isReportable(id)) return false;
    q.status = "cleared"; q.clearedKey = Q.today();
    if (reportText) q.reportText = reportText;
    if (st.clears.indexOf(id) < 0) st.clears.push(id);
    var prevTitle = st.title;
    q.bonusResult = Q.bonuses(id).filter(function (b) { return b.ok; }).map(function (b) { return b.label; });
    if (q.lesson) NT.State.addLesson(id, q.lesson);
    NT.State.recompute();
    /* 花 */
    var pots = NT.Tilemap.potsOf(def.floor), fl = st.flowers[def.floor] = st.flowers[def.floor] || [];
    var bandY = NT.Tilemap.bandY(def.floor);
    for (var i = 0; i < pots.length; i++) {
      var p = [pots[i][0], bandY + pots[i][1]];
      if (!fl.some(function (x) { return x[0] === p[0] && x[1] === p[1]; })) { fl.push(p); break; }
    }
    NT.State.addLog(id + ".clear", def.title);
    NT.State.touch();
    NT.Audio.play("clear"); NT.Loop.freeze(20); NT.Loop.shake(2, 120);
    var titleChanged = prevTitle !== st.title;
    var msgs = [TX().cleared + "　" + def.num + " " + def.title, TX().mark + "（" + st.marks + "/10）", TX().flower];
    if (q.bonusResult.length) msgs.push(TX().bonus + "：" + q.bonusResult.join("、"));
    if (titleChanged) msgs.push(NT.Util.fmt(TX().title, { t: st.title }));
    if (st.marks === 3) msgs.push("1F の 扉が ひらいた");
    if (st.marks === 10) msgs.push("十の しるしが そろった。長老に 会いに いこう");
    Q.ceremony(msgs, titleChanged);
    return true;
  };
  Q.ceremony = function (msgs, titleChanged) {
    var i = 0;
    function next() {
      if (i >= msgs.length) return;
      var m = msgs[i++];
      if (titleChanged && i === msgs.length) NT.Audio.play("rank");
      if (i === 3) NT.Audio.play("bloom");
      NT.Scenes.push(NT.Notice(m, next, { color: i === 1 ? "#f4d03f" : "#f4f1e8" }));
    }
    next();
  };

  /* ---- 会話からのフック ---- */
  NT.Dialog.hooks["quest.accept"] = function (id) { Q.accept(id); };
  NT.Dialog.hooks["quest.open"] = function (id) { NT.Flow.openQuest(id, "prep"); return "stop"; };
  NT.Dialog.hooks["quest.report"] = function (id) { NT.Flow.openQuest(id, "report"); return "stop"; };
  NT.Dialog.hooks["scene.save"] = function () { NT.Flow.openSave(); return "stop"; };
  NT.Dialog.hooks["white.start"] = function () { NT.Flow.openWhite("q1"); return "stop"; };
})();
</script>

<script>
//# sourceURL=src/js/53_scene_quest.js
/* クエスト画面。タブ：じゅんび / じっこう / ほうこく。入力は InputBox、選択は Menu を重ねる。
   定義（data/quests.js）から汎用に組み立て、個別の見せ方だけ NT.QuestImpl[id] で上書きする */
(function () {
  "use strict";
  var NT = window.NT;
  var T = NT.Text, G = NT.Gfx, I = NT.Input, Q = NT.Quests, U = NT.Util;
  var TX = function () { return NT.DATA.TEXT.quest; };
  var TABS = ["prep", "exec", "report"];
  var LIST_X = 16, LIST_W = 288;
  var BOX = { x: 24, y: 70, w: 272 };

  NT.SceneQuest = function (id, tab) {
    var def = Q.def(id), impl = NT.QuestImpl[id] || {}, ex = def.exec || {};
    var tabIndex = Math.max(0, TABS.indexOf(tab || "prep"));
    var cursor = 0, scroll = 0, flash = 0;
    var FIELD_LABELS = { when: TX().when, where: TX().where, how: TX().how, obstacle: TX().obstacle };

    function q() { return Q.state(id); }
    function lists() { return Q.lists(def); }
    function list(L) { var st = q(); st[L.kind] = st[L.kind] || []; return st[L.kind]; }
    function extras() { return (def.prep && def.prep.extras) || []; }
    function isDeclaredEntry(e) { return !!(q().declared && q().declared.text === e.text); }

    /* 項目の 1 行表示 */
    function entryLine(e, L) {
      if (impl.entryLine) return impl.entryLine(e, q(), L);
      var mark = "○ ";
      (ex.commands || []).forEach(function (c) { if (e[(c.flag || "done") + "Key"]) mark = (c.mark || "●") + " "; });
      if (isDeclaredEntry(e)) mark = "★ ";
      var suffix = e.date ? "（" + NT.Time.mmdd(e.date).replace("-", "/") + "）" : "";
      if (L && L.tags && e.tag && e.tag !== "none") { var tg = L.tags.filter(function (t) { return t[0] === e.tag; })[0]; if (tg) suffix += "〔" + tg[1] + "〕"; }
      return mark + e.text + suffix;
    }

    /* 各タブの行を組み立てる */
    function rows() {
      var out = [], st = q();
      if (TABS[tabIndex] === "prep") {
        out.push({ kind: "head", label: TX().plan });
        (def.prep.fields || []).forEach(function (f) {
          var v = (st.plan && st.plan[f]) || "";
          out.push({ kind: "field", field: f, label: FIELD_LABELS[f] + "：" + (v || "（未記入）"), dim: !v });
        });
        extras().forEach(function (xd) {
          if (xd.key === (def.report && def.report.reflectKey)) return;
          var v = st.extras[xd.key] || "";
          out.push({ kind: "extra", extra: xd, label: xd.label + "：" + (v || "（未記入）"), dim: !v });
        });
        lists().forEach(function (L) {
          if (ex.attemptsAreActions && L.kind === "attempts") return;
          var l = list(L);
          out.push({ kind: "head", label: L.label + "（" + l.length + "/" + L.max + "）" });
          l.forEach(function (e, i) { out.push({ kind: "entry", entry: e, L: L, index: i, label: entryLine(e, L) }); });
          if (l.length < L.max) out.push({ kind: "add", L: L, label: TX().add });
        });
      } else if (TABS[tabIndex] === "exec") {
        var status = impl.execStatus ? impl.execStatus(st, def) : defaultExecStatus(st);
        status.forEach(function (l) { out.push({ kind: "info", label: l }); });
        if (ex.declare) {
          dailyCommands(st).forEach(function (c) { out.push({ kind: "daily", cmd: c, label: c.label, dim: c.disabled }); });
        }
        if (ex.white) out.push({ kind: "white", label: "10分 なにもしない を はじめる" });
        if (ex.attemptsAreActions) {
          var La = Q.listDef(def, "attempts"), la = list(La);
          out.push({ kind: "head", label: La.label + "（" + la.length + "）" });
          la.forEach(function (e, i) { out.push({ kind: "entry", entry: e, L: La, index: i, label: "● " + e.text + "　" + (e.k || "") }); });
          if (la.length < La.max) out.push({ kind: "add", L: La, label: "＋ 挑戦した（記録を入れる）" });
        }
        lists().forEach(function (L) {
          if (ex.attemptsAreActions && L.kind === "attempts") return;
          var l = list(L);
          out.push({ kind: "head", label: L.label });
          if (!l.length) out.push({ kind: "info", label: "（じゅんび で 書き出す）" });
          l.forEach(function (e, i) { out.push({ kind: "entry", entry: e, L: L, index: i, label: entryLine(e, L) }); });
        });
      } else {
        out.push({ kind: "head", label: TX().condition });
        Q.conditions(id).forEach(function (c) { out.push({ kind: "info", label: (c.ok ? "● " : "○ ") + c.label, color: c.ok ? "#7dffb0" : "#f4f1e8" }); });
        var bs = Q.bonuses(id);
        if (bs.length) { out.push({ kind: "head", label: TX().bonus }); bs.forEach(function (b) { out.push({ kind: "info", label: (b.ok ? "★ " : "○ ") + b.label, color: b.ok ? "#f4d03f" : "#9aa0b4" }); }); }
        if (def.report && def.report.reflectKey) {
          var rv = st.extras[def.report.reflectKey] || "";
          out.push({ kind: "extra", extra: { key: def.report.reflectKey, label: def.report.reflectLabel || "ふりかえり", maxLen: 60 }, label: (def.report.reflectLabel || "ふりかえり") + "：" + (rv || "（未記入）"), dim: !rv });
        }
        if (def.report && def.report.lesson) out.push({ kind: "lesson", label: TX().lesson + "：" + (st.lesson || "（未記入）"), dim: !st.lesson });
        if (st.status === "cleared") out.push({ kind: "info", label: TX().cleared + "　" + (st.clearedKey || ""), color: "#f4d03f" });
        else out.push({ kind: "report", label: "長老に ほうこくする", dim: !Q.isReportable(id) });
      }
      return out;
    }
    function defaultExecStatus(st) {
      var lines = [];
      if (ex.declare) {
        if (!st.declared) lines.push(ex.declareFrom ? "じゅんび で 書いたものから えらんで 宣言しよう" : "候補を えらんで 宣言しよう");
        else {
          lines.push("宣言：" + st.declared.text);
          lines.push(U.fmt(TX().streak, { n: Q.streak(st) }) + "（" + st.declared.startKey.slice(5).replace("-", "/") + "〜）");
          lines.push(TX().charm + "　" + U.fmt(TX().charmLeft, { n: st.charms || 0 }));
        }
      }
      return lines;
    }
    function dailyCommands(st) {
      if (!st.declared) return [];
      var can = Q.canCheckToday(st);
      return [
        { label: ex.checkLabel || "きょうも やった", value: "check", disabled: !can.ok },
        { label: "おやすみのお守りを つかう", value: "charm", disabled: !(st.charms > 0) || !can.ok }
      ];
    }
    function selectable(r) { return r.kind !== "head" && r.kind !== "info"; }
    function clampCursor(rs) {
      if (!rs.length) { cursor = 0; return; }
      cursor = U.clamp(cursor, 0, rs.length - 1);
      var guard = 0;
      while (!selectable(rs[cursor]) && guard++ < rs.length) cursor = (cursor + 1) % rs.length;
    }
    function moveCursor(rs, d) {
      if (!rs.length) return;
      var i = cursor, guard = 0;
      do { i = (i + d + rs.length) % rs.length; guard++; } while (!selectable(rs[i]) && guard <= rs.length);
      if (selectable(rs[i])) { cursor = i; NT.Audio.play("cursor"); }
    }

    /* ---- 入力 ---- */
    function ask(title, value, maxLen, multiline, cb) {
      NT.InputBox.open({ x: BOX.x, y: BOX.y, w: BOX.w, maxLen: maxLen || 40, title: title, value: value || "", multiline: !!multiline, rows: multiline ? 2 : 1, onDone: cb });
    }
    function editField(f) {
      var st = q();
      ask(FIELD_LABELS[f], st.plan[f], 40, false, function (v) { if (v !== null) { st.plan[f] = v; NT.State.touch(); } });
    }
    function editExtra(xd) {
      var st = q();
      ask(xd.label, st.extras[xd.key], xd.maxLen || 40, !!xd.multiline, function (v) { if (v !== null) { st.extras[xd.key] = v; NT.State.touch(); } });
    }
    function addEntry(L) {
      ask(L.itemLabel, "", 30, false, function (text) {
        if (!text) return;
        var e = { id: U.uid(), text: text };
        afterText(e, L, function () {
          list(L).push(e); NT.State.touch();
          if (ex.attemptsAreActions && L.kind === "attempts") onAttempt(e); else NT.Audio.play("tap");
        });
      });
    }
    function afterText(e, L, done) {
      var steps = [];
      if (L.tags) steps.push(function (next) {
        NT.Scenes.push(NT.Menu({ title: "どんな物？", w: 200, items: L.tags.map(function (t) { return { label: t[1], value: t[0] }; }), cancelable: false,
          onSelect: function (it) { e.tag = it.value; NT.Scenes.pop(); next(); } }));
      });
      (L.extra || []).forEach(function (exd) {
        steps.push(function (next) { ask(exd[1], e[exd[0]], 60, false, function (v) { if (v !== null) e[exd[0]] = v; next(); }); });
      });
      var i = 0;
      (function run() { if (i < steps.length) steps[i++](run); else done(); })();
    }
    /* ② 挑戦の記録：追加そのものが実行 */
    function onAttempt(e) {
      var st = q();
      e.k = Q.today();
      st.status = "doing";
      var rec = Q.num(st.extras.record), v = Q.num(e.text), tgt = Q.num(st.extras.target);
      var isNew = !isNaN(rec) && !isNaN(v) && v > rec;
      NT.State.addLog(id + ".attempt", e.text);
      NT.Audio.play(isNew ? "clear" : "item"); NT.Loop.freeze(isNew ? 12 : 6); flash = 180;
      var msg = isNew ? "NEW RECORD！　" + e.text + "（いままで " + st.extras.record + "）" : (!isNaN(tgt) && !isNaN(v) && v >= tgt ? "目標に とどいた！　" + e.text : "挑戦を 記録した　" + e.text);
      NT.Scenes.push(NT.Notice(msg, null, { color: isNew ? "#f4d03f" : "#f4f1e8" }));
    }
    function editEntry(e, L) {
      ask(L.itemLabel, e.text, 30, false, function (text) {
        if (!text) return;
        if (isDeclaredEntry(e)) q().declared.text = text;
        e.text = text;
        afterText(e, L, function () { NT.State.touch(); });
      });
    }
    function canDeclareFrom(e, L) {
      if (!ex.declare || q().declared) return false;
      if (ex.declareFrom && L.kind !== ex.declareFrom) return false;
      if (ex.declareLast) { var l = list(L); return l.length >= (L.min || 1) && l[l.length - 1] === e; }
      return true;
    }
    function entryMenu(e, L) {
      var items;
      if (impl.entryCommands) items = impl.entryCommands(q(), e, L);
      else {
        items = [];
        (ex.commands || []).forEach(function (c) { if (!e[(c.flag || "done") + "Key"]) items.push({ label: c.label, value: "cmd", cmd: c }); });
        if (e.undoUntil > NT.Loop.elapsed && e[(e.undoFlag || "done") + "Key"]) items.push({ label: TX().undo, value: "undo" });
        if (canDeclareFrom(e, L)) items.push({ label: ex.declareLabel || "これを 宣言する", value: "declare" });
        items.push({ label: TX().edit, value: "edit" });
        if (!isDeclaredEntry(e) && !(ex.attemptsAreActions && L.kind === "attempts")) items.push({ label: TX().remove, value: "remove" });
        items.push({ label: NT.DATA.TEXT.menu.back, value: "back" });
      }
      NT.Scenes.push(NT.Menu({ title: e.text, w: 260, items: items, onSelect: function (it) {
        NT.Scenes.pop();
        if (it.value === "cmd" || it.value === "do") runCommand(e, it.cmd);
        else if (it.value === "undo") { Q.undo(id, e); NT.State.touch(); }
        else if (it.value === "edit") editEntry(e, L);
        else if (it.value === "remove") { var l = list(L); l.splice(l.indexOf(e), 1); NT.State.touch(); NT.Audio.play("cancel"); }
        else if (it.value === "declare") {
          var go = function (reason) { Q.declare(id, e.text, reason); flash = 180; };
          if (ex.declareFrom || e.reason) go(e.reason);
          else ask(TX().reasonPrompt, "", 60, false, function (v) { if (v === null) return; e.reason = v; go(v); });
        }
      } }));
    }
    function runCommand(e, cmd) {
      if (cmd.input) {
        var inp = cmd.input;
        ask(inp.title, e[inp.field] || "", inp.maxLen || 20, false, function (v) {
          if (v === null || v === "") return;
          if (inp.kind === "date") {
            var key = Q.parseDate(v);
            if (!key) { NT.Audio.play("error"); NT.Scenes.push(NT.Notice("日付が 読めなかった。例：1/20 や 2027-01-20")); return; }
            if (key < Q.today()) { NT.Audio.play("error"); NT.Scenes.push(NT.Notice("きょうより あとの 日付を 入れてね")); return; }
            v = key;
          }
          Q.markFlag(id, e, cmd, v); flash = 180;
        });
        return;
      }
      NT.Scenes.push(NT.Confirm(U.fmt(TX().confirmDone, { text: e.text }), function () { Q.markFlag(id, e, cmd); flash = 180; }, null, { defaultYes: true }));
    }
    function daily(c) {
      if (c.value === "check") {
        var r = Q.checkToday(id);
        if (!r.ok) { NT.Audio.play("error"); NT.Scenes.push(NT.Notice(r.why)); return; }
        flash = 180;
        NT.Scenes.push(NT.Notice(U.fmt(TX().streak, { n: r.streak })));
      } else if (c.value === "charm") {
        var r2 = Q.useCharm(id);
        if (!r2.ok) { NT.Audio.play("error"); NT.Scenes.push(NT.Notice(r2.why)); return; }
        NT.Scenes.push(NT.Notice(TX().charmUsed));
      }
    }
    function editLesson() {
      ask(def.report.lessonPrompt || TX().lessonPrompt, q().lesson, 60, true, function (v) { if (v !== null) { q().lesson = v; NT.State.touch(); } });
    }
    function report() {
      if (!Q.isReportable(id)) { NT.Audio.play("error"); NT.Scenes.push(NT.Notice(TX().needMore)); return; }
      ask(TX().reportText, "", 60, true, function (v) {
        if (v === null) return;
        NT.Scenes.push(NT.Confirm(TX().confirmReport, function () {
          NT.Scenes.remove(scene);
          Q.clear(id, v);
        }, null, { defaultYes: true }));
      });
    }
    function activate(r) {
      if (r.kind === "field") editField(r.field);
      else if (r.kind === "extra") editExtra(r.extra);
      else if (r.kind === "add") addEntry(r.L);
      else if (r.kind === "entry") entryMenu(r.entry, r.L);
      else if (r.kind === "daily") { if (r.cmd.disabled) { NT.Audio.play("error"); var can = Q.canCheckToday(q()); NT.Scenes.push(NT.Notice(can.why || TX().needMore)); } else daily(r.cmd); }
      else if (r.kind === "white") NT.Flow.openWhite(id);
      else if (r.kind === "lesson") editLesson();
      else if (r.kind === "report") report();
    }

    var scene = {
      id: "QUEST", opaque: true,
      enter: function () { if (q().status === "offered") Q.accept(id); clampCursor(rows()); },
      resume: function () { clampCursor(rows()); },
      update: function (dt) {
        NT.State.tick(dt);
        if (flash > 0) flash -= dt;
        var rs = rows();
        if (!rs[cursor] || !selectable(rs[cursor])) clampCursor(rs);
        if (I.pressed("left")) { tabIndex = (tabIndex + 2) % 3; cursor = 0; scroll = 0; clampCursor(rows()); NT.Audio.play("cursor"); return; }
        if (I.pressed("right")) { tabIndex = (tabIndex + 1) % 3; cursor = 0; scroll = 0; clampCursor(rows()); NT.Audio.play("cursor"); return; }
        if (I.pressed("up")) moveCursor(rs, -1);
        if (I.pressed("down")) moveCursor(rs, 1);
        if (I.pressed("ok")) { I.consume("ok"); if (rs[cursor] && selectable(rs[cursor])) { NT.Audio.play("decide"); activate(rs[cursor]); } return; }
        if (I.pressed("cancel") || I.pressed("menu")) { I.consume("cancel"); I.consume("menu"); NT.Audio.play("close"); NT.Scenes.pop(); return; }
        var cl = I.clicks();
        for (var k = 0; k < cl.length; k++) {
          var c = cl[k];
          if (c.y >= 30 && c.y < 46) { var ti = Math.floor((c.x - LIST_X) / 84); if (ti >= 0 && ti < 3) { tabIndex = ti; cursor = 0; scroll = 0; clampCursor(rows()); NT.Audio.play("cursor"); } return; }
          if (c.y >= NT.H - 18) { NT.Scenes.pop(); return; }
          var ri = Math.floor((c.y - 52 + scroll) / 16);
          if (ri >= 0 && ri < rs.length && selectable(rs[ri])) { cursor = ri; NT.Audio.play("decide"); activate(rs[ri]); return; }
        }
        var top = cursor * 16, viewH = NT.H - 52 - 22;
        if (top - scroll > viewH - 16) scroll = top - (viewH - 16);
        if (top - scroll < 0) scroll = top;
      },
      draw: function (ctx) {
        NT.Screen.clear("#0a0a16");
        var st = q();
        ctx.fillStyle = "#15152a"; ctx.fillRect(0, 0, NT.W, 28);
        T.draw(ctx, def.num + " " + def.title, 10, 6, "#f4d03f", { head: true, size: 16 });
        var statusTxt = st.status === "cleared" ? TX().cleared : Q.progressText(id);
        T.drawRight(ctx, statusTxt, NT.W - 10, 8, st.status === "cleared" ? "#7dffb0" : "#9aa0b4");
        for (var i = 0; i < 3; i++) {
          var tx = LIST_X + i * 84, label = [TX().prep, TX().exec, TX().report][i];
          var on = i === tabIndex;
          ctx.fillStyle = on ? "#f4d03f" : "#2a2a3e"; ctx.fillRect(tx, 30, 80, 16);
          T.draw(ctx, label, tx + 6, 32, on ? "#000" : "#9aa0b4");
        }
        T.draw(ctx, "◀▶", NT.W - 40, 32, "#5b5a66");
        var rs = rows();
        ctx.save(); ctx.beginPath(); ctx.rect(0, 50, NT.W, NT.H - 50 - 20); ctx.clip();
        for (var r = 0; r < rs.length; r++) {
          var row = rs[r], y = 52 + r * 16 - scroll;
          if (y < 36 || y > NT.H - 20) continue;
          var color = row.color || (row.kind === "head" ? "#f4afc4" : row.dim ? "#6e6a7a" : "#f4f1e8");
          var x = row.kind === "head" ? LIST_X : LIST_X + 12;
          var lbl = row.label;
          if (T.measure(lbl) > LIST_W - 16) { while (T.measure(lbl + "…") > LIST_W - 16 && lbl.length) lbl = lbl.slice(0, -1); lbl += "…"; }
          T.draw(ctx, lbl, x, y, color);
          if (r === cursor && selectable(row)) G.cursor(ctx, LIST_X + 2, y + 1, flash > 0 ? "#7dffb0" : "#f4d03f");
        }
        ctx.restore();
        ctx.fillStyle = "#15152a"; ctx.fillRect(0, NT.H - 20, NT.W, 20);
        var hint = TABS[tabIndex] === "exec" && impl.execHint ? impl.execHint : TABS[tabIndex] === "prep" ? def.summary : "条件が そろったら 長老に ほうこく";
        var hl = T.wrap(hint, NT.W - 70);
        T.draw(ctx, hl[0], 8, NT.H - 16, "#9aa0b4");
        T.drawRight(ctx, "X:とじる", NT.W - 8, NT.H - 16, "#5b5a66");
        NT.InputBox.draw(ctx);
      },
      /* テスト用 */
      rows: function () { return rows().map(function (r) { return { kind: r.kind, label: r.label }; }); },
      setTab: function (i) { tabIndex = i; cursor = 0; scroll = 0; clampCursor(rows()); },
      cursorTo: function (pred) { var rs = rows(); for (var i = 0; i < rs.length; i++) if (selectable(rs[i]) && pred(rs[i])) { cursor = i; return true; } return false; },
      activateCursor: function () { var rs = rows(); if (rs[cursor] && selectable(rs[cursor])) activate(rs[cursor]); }
    };
    return scene;
  };
})();

/* ⑧〜② の見せ方。コマンドや条件は data/quests.js の定義と 53_scene_quest.js の汎用処理で動く */
(function () {
  "use strict";
  var NT = window.NT;
  var Q = function () { return NT.Quests; };
  NT.QuestImpl = NT.QuestImpl || {};

  NT.QuestImpl.q8 = {

    },

  };

  NT.QuestImpl.q7 = {

      var ok = ["support", "knowledge", "pastLesson"].filter(function (k) { return q.extras[k]; }).length;
      return ["3要素（頼る人・知識・教訓）：" + ok + "/3　そろえてから 再開", "完走は いらない。再開した事実が 大事"];
    },
    execHint: "挫折の原因は 実力ではなく、頼れなかったこと。まず 人に 頼る"
  };

  NT.QuestImpl.q6 = {
    execStatus: function (q) {
      var n = Q().withFlag(q, "wants:done", Q().def("q6")).length;

    },
    execHint: "とりあえず 手を付けてみてから 判断する。義務感のないものを"
  };

  NT.QuestImpl.q5 = {
    execStatus: function (q) {
      var lines = [];
      if (q.extras.goal) lines.push("変えたいこと：" + q.extras.goal);

      if (!q.declared) lines.push(q.steps && q.steps.length >= 3 ? "いちばん下を えらんで 宣言しよう" : "じゅんび で 3段階まで 小さくする");
      else {

        lines.push(NT.DATA.TEXT.quest.charm + "　" + NT.Util.fmt(NT.DATA.TEXT.quest.charmLeft, { n: q.charms || 0 }));
      }

    },
    execHint: "はるかに 小さく。腕立て1回の 大きさで、変わりながら つづける"
  };

  NT.QuestImpl.q4 = {
    execStatus: function (q) {
      var def = Q().def("q4");
      var c = Q().withFlag(q, "people:contacted", def).length, s = Q().withFlag(q, "people:scheduled", def);
      var lines = ["連絡した：" + c + "人　予定が決まった：" + s.length + "件"];
      if (s.length) lines.push("仲間：" + s.map(function (e) { return e.text; }).join("、"));
      lines.push("断られても 気にしない。連絡は 思っているより 喜ばれる");
      return lines;
    },
    execHint: "自分から 誘う。「どこかで ごはん 行きましょう」で じゅうぶん"

  NT.QuestImpl.q3 = {

      var today = Q().today(), soonest = null;

      var days = soonest ? NT.Time.diffDays(today, soonest.date) : 0;
      return ["予定：" + planned.length + "件　いちばん近い：" + soonest.text + "（" + NT.Time.mmdd(soonest.date).replace("-", "/") + "）", "待つ時間：あと " + days + "日。楽しみに 待つ あいだが いちばん 幸福"];
    },
    execHint: "予定を 先に 立てると、それを 待つ時間ごと 幸せになる"
  };

  NT.QuestImpl.q2 = {
    execStatus: function (q) {
      var lines = [];
      lines.push("できたこと：" + (q.extras.did || "（未記入）"));
      lines.push("いまの記録：" + (q.extras.record || "―") + "　ちょい上の目標：" + (q.extras.target || "―"));
      var best = null;
      (q.attempts || []).forEach(function (a) { var v = Q().num(a.text); if (!isNaN(v) && (best === null || v > best)) best = v; });
      if (best !== null) lines.push("挑戦の ベスト：" + best + (Q().newRecord(q) ? "　★ NEW RECORD" : ""));
      return lines;
    },
    execHint: "締切の力。小さくても「ちょい上」が どこかを 知るのが ポイント"
  };

  NT.QuestImpl.q1 = {

      if (q.extras.detox) lines.push("離れるもの：" + q.extras.detox);
      lines.push("1F の 奥の部屋でも はじめられる。さわると ボスが 回復する");
      return lines;
    },
    execHint: "空白は 目的のある 時間。ダラダラとは ちがう。10分、なにも しない"
  };
})();

<script>
//# sourceURL=src/js/55_scene_white.js
/* ① ホワイトタイム：10分 なにもしない。操作すると ボスが 回復する（＝残り時間が戻る）。X / Esc で中断（失敗ではない） */
(function () {
  "use strict";
  var NT = window.NT;
  var T = NT.Text, G = NT.Gfx, I = NT.Input;

  NT.SceneWhite = function (id) {
    var def = NT.Quests.def(id), total = (NT.query.white ? +NT.query.white : (def.exec && def.exec.whiteSeconds) || 600) * 1000;
    var remain = total, t = 0, heal = 0, healMsg = 0, done = false, dawn = 0, touches = 0, started = false;
    function finish() {
      if (done) return;
      done = true;
      NT.Quests.whiteDone(id, Math.round(total / 1000));
      NT.Audio.play("bloom");
      NT.Scenes.push(NT.Notice("10分、なにも しなかった。ボスは しずかに 消えた", function () { NT.Scenes.pop(); }, { color: "#f4d03f" }));
    }
    function quit() {
      NT.Scenes.push(NT.Confirm("ここで やめますか？（失敗には ならない。また いつでも）", function () { NT.Scenes.pop(); }, null, { y: 150 }));
    }
    var scene = {
      id: "WHITE", opaque: true,
      enter: function () { NT.Audio.stopMusic(); t = 0; },
      update: function (dt) {
        if (done) { dawn = Math.min(1, dawn + dt / 1500); return; }
        t += dt;
        if (!started) { started = true; return; }
        if (I.pressed("cancel")) { I.consume("cancel"); quit(); return; }
        /* さわると回復 */
        var touched = I.anyKey() || I.clicks().length;
        if (touched && t > 400) {
          touches++;
          var back = Math.min(total - remain, 30000);
          remain += back; heal = 600; healMsg = 2600;
          NT.Audio.play("error");
        }
        if (heal > 0) heal -= dt;
        if (healMsg > 0) healMsg -= dt;
        remain -= dt;
        if (remain <= 0) { remain = 0; finish(); }
      },
      draw: function (ctx) {
        var p = 1 - remain / total;
        /* 深い色から 夜明けへ */
        var r = Math.round(10 + 40 * p + 200 * dawn), g = Math.round(10 + 30 * p + 180 * dawn), b = Math.round(22 + 60 * p + 150 * dawn);
        ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")"; ctx.fillRect(0, 0, NT.W, NT.H);
        /* 星が少しずつ消える */
        var rng = NT.Util.rng(11);
        for (var i = 0; i < 40; i++) { var sx = Math.floor(rng() * NT.W), sy = Math.floor(rng() * 150); if (rng() > p * 0.9) { ctx.fillStyle = "rgba(244,241,232," + (0.5 - dawn * 0.5) + ")"; ctx.fillRect(sx, sy, 1, 1); } }
        /* ボス：息をする雲。回復中は赤く */
        var breathe = Math.sin(t / 900) * 3, size = 1 - p * 0.6 - dawn;
        if (size > 0) {
          var cx = NT.W / 2, cy = 110 + breathe;
          ctx.fillStyle = heal > 0 ? "rgba(244,175,196," + size + ")" : "rgba(255,255,255," + (0.85 * size) + ")";
          [[0, 0, 28], [-22, 6, 18], [22, 6, 18], [-10, -12, 16], [12, -12, 16]].forEach(function (c) {
            ctx.beginPath(); ctx.ellipse(cx + c[0], cy + c[1], c[2] * (0.6 + size * 0.4), c[2] * 0.8 * (0.6 + size * 0.4), 0, 0, Math.PI * 2); ctx.fill();
          });
          ctx.fillStyle = "rgba(29,27,46," + size + ")";
          ctx.fillRect(cx - 12, cy - 2, 7, 2); ctx.fillRect(cx + 5, cy - 2, 7, 2);
        }
        /* ねこ太は すわっている */
        if (NT.Sprites.ready && dawn < 1) NT.Sprites.draw(ctx, "nekota:up:0", NT.W / 2, 196);
        /* 文字は最小限 */
        var mm = Math.floor(remain / 60000), ss = Math.floor((remain % 60000) / 1000);
        var dim = "rgba(244,241,232," + (0.35 + 0.3 * (1 - p)) + ")";
        if (!done) {
          T.drawCenter(ctx, "なにも しない", NT.W / 2, 40, dim);
          T.drawCenter(ctx, mm + ":" + NT.Util.pad2(ss), NT.W / 2, NT.H - 30, dim);
          if (healMsg > 0) T.drawCenter(ctx, "さわると ボスが 回復する", NT.W / 2, 60, "#f4afc4");
          if (t < 4000) T.drawCenter(ctx, "手を はなして。X で やめられる", NT.W / 2, NT.H - 14, "rgba(244,241,232,.35)");
        } else {
          T.drawCenter(ctx, "夜が あけた", NT.W / 2, 40, "#f4f1e8", { head: true, size: 16 });
        }
      },
      state: function () { return { remain: Math.round(remain / 1000), touches: touches, done: done }; }
    };
    return scene;
  };
  NT.Flow = NT.Flow || {};
  NT.Flow.openWhite = function (id) {
    var q = NT.Quests.state(id || "q1");
    if (q.status === "offered") NT.Quests.accept(id || "q1");
    NT.Scenes.push(NT.SceneWhite(id || "q1"));
  };
})();
</script>

//# sourceURL=src/js/60_scene_save.js
/* きろく（セーブ）。スロット選択 → 書き込み → チャイム */
(function () {
  "use strict";
  var NT = window.NT;
  var S = NT.Save = {};

  S.writeTo = function (n) {
    var rec = NT.State.toRecord();
    var ok = NT.Storage.writeSlot(n, rec);
    if (ok) { NT.State.slot = n; NT.State.setDirty(false); NT.Storage.clearSuspend(); NT.Audio.play("save"); }
    else NT.Audio.play("error");
    return ok;
  };
  S.suspend = function () {
    if (!NT.State.cur || !NT.State.dirty) return;
    try { NT.Storage.writeSuspend(NT.State.toRecord()); } catch (e) { /* 無視 */ }
  };

  NT.Flow = NT.Flow || {};
  NT.Flow.openSave = function () {
    NT.Scenes.push(NT.SceneSlot({ mode: "save", onPick: function (n) {
      var ok = S.writeTo(n);
      var msg = ok ? NT.DATA.TEXT.save.done + "（きろく " + n + "）" : NT.DATA.TEXT.save.fail;
      NT.Scenes.push(NT.Notice(msg, null, { y: 100, color: ok ? "#7dffb0" : "#f4afc4" }));
    } }));
  };
})();
</script>
<script>
//# sourceURL=src/js/61_scene_card.js
/* メモリーカード画面。本体メモリのきろくを暗号化CSVに書き出し／読み込み */
(function () {
  "use strict";
  var NT = window.NT;
  var T = NT.Text, G = NT.Gfx, I = NT.Input, TX = function () { return NT.DATA.TEXT.card; };
  var C = NT.Card = {};
  var fileInput = null, dropzone = null;

  function ensureDom() {
    var ov = document.getElementById("overlay");
    if (!fileInput) {
      fileInput = document.createElement("input");
      fileInput.type = "file"; fileInput.id = "filepick"; fileInput.accept = ".csv,text/csv,text/plain";
      fileInput.setAttribute("aria-label", "メモリーカードを選ぶ");
      ov.appendChild(fileInput);
      fileInput.addEventListener("change", function () {
        var f = fileInput.files && fileInput.files[0];
        fileInput.value = "";
        if (f) C.importFile(f);
      });
    }
    if (!dropzone) {
      dropzone = document.createElement("div");
      dropzone.id = "dropzone"; dropzone.textContent = TX().drop;
      ov.appendChild(dropzone);
    }
  }
  C.installDrop = function () {
    ensureDom();
    var count = 0;
    window.addEventListener("dragenter", function (e) { e.preventDefault(); count++; dropzone.classList.add("show"); });
    window.addEventListener("dragover", function (e) { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = "copy"; });
    window.addEventListener("dragleave", function (e) { e.preventDefault(); count = Math.max(0, count - 1); if (!count) dropzone.classList.remove("show"); });
    window.addEventListener("drop", function (e) {
      e.preventDefault(); count = 0; dropzone.classList.remove("show");
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) C.importFile(f);
    });
  };
  C.pickFile = function () { ensureDom(); fileInput.click(); };

  /* ---- 書き出し ---- */
  C.download = function (text, name) {
    var blob = new Blob([text], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
  };
  C.exportSlot = function (n, password) {
    var r = NT.Storage.readSlot(n);
    if (!r || !r.rec) return Promise.reject(new Error("empty"));
    return NT.Codec.encodeCard([{ slot: n, record: r.rec }], { password: password || undefined }).then(function (csv) {
      var name = NT.Codec.fileName(n, new Date(NT.Time.now()));
      C.download(csv, name);
      C.lastExport = { name: name, csv: csv };
      return name;
    });
  };
  /* ---- 読み込み ---- */
  C.importText = function (text, password) {
    return NT.Codec.decodeCard(text, { password: password || undefined });
  };
  C.importFile = function (file) {
    var scene = NT.Scenes.find("CARD");
    file.text().then(function (text) {
      C.pendingText = text;
      if (scene) scene.onFileText(text); else NT.Flow.openCard(text);
    }).catch(function () { NT.Scenes.push(NT.Notice(TX().bad)); });
  };

  /* ---- 画面 ---- */
  NT.SceneCard = function (opts) {
    opts = opts || {};
    var menu = null, status = "", statusColor = "#9aa0b4", busy = false, closing = false;
    /* 自分（CARD）とメニューをまとめて閉じる。先に閉じる印を立てないと resume がメニューを開き直してしまう */
    function closeCard() {
      closing = true;
      NT.Audio.play("close");
      NT.Scenes.remove(scene);
      var m = NT.Scenes.find("CARDMENU"); if (m) NT.Scenes.remove(m);
    }
    function setStatus(s, col) { status = s; statusColor = col || "#9aa0b4"; }
    function askPassword(title, cb) {
      NT.InputBox.open({ x: 24, y: 70, w: 272, maxLen: 32, title: title, hint: "なしなら そのまま Enter", onDone: function (v) { cb(v); } });
    }
    function doExport() {
      if (!NT.Codec.isSupported()) { setStatus(TX().unsupported, "#f4afc4"); NT.Audio.play("error"); return; }
      var items = [];
      for (var n = 1; n <= 3; n++) { var r = NT.Storage.readSlot(n); items.push({ label: "きろく " + n + (r && r.rec ? "　" + r.rec.state.name : "　" + NT.DATA.TEXT.slot.empty), value: n, disabled: !(r && r.rec) }); }
      if (NT.State.cur && NT.State.dirty) items.unshift({ label: "いまの状態を そのまま", value: 0 });
      items.push({ label: NT.DATA.TEXT.menu.back, value: -1 });
      NT.Scenes.push(NT.Menu({ title: TX().choose, w: 230, items: items, onSelect: function (it) {
        NT.Scenes.pop();
        if (it.value < 0) return;
        askPassword(TX().passPrompt, function (pw) {
          if (pw === null) return;
          var go = function (pw2) {
            busy = true;
            var p;
            if (it.value === 0) {
              var rec = NT.State.toRecord();
              p = NT.Codec.encodeCard([{ slot: NT.State.slot || 1, record: rec }], { password: pw2 || undefined }).then(function (csv) {
                var name = NT.Codec.fileName(NT.State.slot || 1, new Date(NT.Time.now())); C.download(csv, name); C.lastExport = { name: name, csv: csv }; return name;
              });
            } else p = C.exportSlot(it.value, pw2);
            p.then(function (name) { busy = false; setStatus(NT.Util.fmt(TX().exported, { file: name }), "#7dffb0"); NT.Audio.play("save"); })
             .catch(function () { busy = false; setStatus(TX().bad, "#f4afc4"); NT.Audio.play("error"); });
          };
          if (pw) askPassword(TX().passAgain, function (pw2) { if (pw2 === null) return; if (pw2 !== pw) { setStatus(TX().passMismatch, "#f4afc4"); NT.Audio.play("error"); return; } go(pw); });
          else go("");
        });
      } }));
    }
    function doImport() {
      if (!NT.Codec.isSupported()) { setStatus(TX().unsupported, "#f4afc4"); NT.Audio.play("error"); return; }
      setStatus(TX().drop + "、または ファイルを えらぶ");
      C.pickFile();
    }
    function onFileText(text) {
      busy = true;
      var tryDecode = function (pw) {
        C.importText(text, pw).then(function (entries) {
          busy = false;
          if (!entries.length) throw new Error("empty");
          var e = entries[0];
          var migrated = NT.Storage.migrate(e.record);
          if (!migrated || migrated.tooNew) { setStatus(TX().bad, "#f4afc4"); NT.Audio.play("error"); return; }
          var items = [];
          for (var n = 1; n <= 3; n++) { var r = NT.Storage.readSlot(n); items.push({ label: "きろく " + n + (r && r.rec ? "　" + r.rec.state.name : "　" + NT.DATA.TEXT.slot.empty), value: n }); }
          items.push({ label: NT.DATA.TEXT.menu.back, value: -1 });
          NT.Scenes.push(NT.Menu({ title: TX().toSlot + "（" + migrated.rec.state.name + "）", w: 240, items: items, onSelect: function (it) {
            NT.Scenes.pop();
            if (it.value < 0) return;
            var write = function () {
              var ok = NT.Storage.writeSlot(it.value, migrated.rec);
              setStatus(ok ? TX().imported + "（きろく " + it.value + "）" : NT.DATA.TEXT.save.fail, ok ? "#7dffb0" : "#f4afc4");
              NT.Audio.play(ok ? "save" : "error");
              C.lastImport = { slot: it.value, rec: migrated.rec };
            };
            var r = NT.Storage.readSlot(it.value);
            if (r && r.rec) NT.Scenes.push(NT.Confirm(NT.Util.fmt(NT.DATA.TEXT.slot.overwrite, { n: it.value }), write)); else write();
          } }));
        }).catch(function (err) {
          busy = false;
          if (err && err.code === "auth" && pw === undefined) {
            /* あいことば付きかもしれないので一度だけ聞く */
            askPassword(TX().passPrompt, function (v) { if (v === null || v === "") { setStatus(TX().bad, "#f4afc4"); NT.Audio.play("error"); return; } busy = true; tryDecode(v); });
            return;
          }
          setStatus(TX().bad, "#f4afc4"); NT.Audio.play("error");
        });
      };
      tryDecode(undefined);
    }
    function openMenu() {
      menu = NT.Menu({ x: 40, y: 56, w: 240, items: [
        { label: TX().export, value: "export" },
        { label: TX().import, value: "import" },
        { label: NT.DATA.TEXT.menu.back, value: "back" }
      ], cancelable: true, onSelect: function (it) {
        if (it.value === "back") { closeCard(); return; }
        if (busy) return;
        if (it.value === "export") doExport(); else doImport();
      }, onCancel: function () { closeCard(); } });
      menu.id = "CARDMENU";
      NT.Scenes.push(menu);
    }
    var scene = {
      id: "CARD", opaque: true,
      enter: function () { C.installDrop(); openMenu(); if (opts.pendingText) setTimeout(function () { onFileText(opts.pendingText); }, 0); },
      resume: function (res, popped) { if (!closing && !NT.Scenes.has("CARDMENU") && NT.Scenes.top() === scene) openMenu(); },
      update: function () {},
      draw: function (ctx) {
        NT.Screen.clear("#070716");
        T.drawCenter(ctx, TX().title, NT.W / 2, 14, "#f4d03f", { head: true, size: 16 });
        /* カードの絵 */
        G.frame(ctx, 110, 120, 100, 60, { fill: "#1d1b3a", border: "#9aa0b4" });
        ctx.fillStyle = "#f4d03f"; ctx.fillRect(118, 128, 24, 14);
        T.draw(ctx, "NETTA", 150, 129, "#f4f1e8"); T.draw(ctx, "CARD", 150, 143, "#9aa0b4");
        T.draw(ctx, "かな で かかれた きろく", 118, 160, "#5b5a66");
        var lines = T.wrap(status || NT.DATA.TEXT.save.memoryNote, 288);
        T.drawLines(ctx, lines, 16, 190, statusColor);
        if (busy) T.drawCenter(ctx, NT.DATA.TEXT.sys.loading + "…", NT.W / 2, 100, "#9aa0b4");
        NT.InputBox.draw(ctx);
      },
      onFileText: onFileText,
      status: function () { return status; }
    };
    return scene;
  };
  NT.Flow = NT.Flow || {};
  NT.Flow.openCard = function (pendingText) { NT.Scenes.push(NT.SceneCard({ pendingText: pendingText })); };
})();
</script>
