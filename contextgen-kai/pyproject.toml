[project]
name = "contextgen-kai"
version = "0.2.1"
description = "contextgen 改 — 資料を整理・確認して Copilot へ渡すローカルアプリ"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "pydantic>=2.9,<3", "pypdf>=5,<7", "pypdfium2>=4.30,<6", "Pillow>=11,<13", "openpyxl>=3.1,<4", "charset-normalizer>=3.3,<4", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "python-docx>=1.1,<2", "python-pptx>=1,<2", "reportlab>=4,<5", "playwright>=1.50,<2", "pyinstaller>=6.11,<7"]

[project.scripts]
contextgen-kai = "contextgen_kai.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contextgen_kai*"]

[tool.setuptools.package-data]
contextgen_kai = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
