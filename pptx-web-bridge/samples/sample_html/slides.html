<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>変換アプリ紹介（スライド型サンプル）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<section class="slide">
  <h1>変換アプリ紹介（スライド型サンプル）</h1>
  <p class="lead">サンプル株式会社（架空） 業務推進部</p>
</section>
<section class="slide">
  <h2>目的</h2>
  <ul>
    <li>PowerPoint から Web 図解を生成する</li>
    <li>Web 図解から再編集可能な PowerPoint を生成する</li>
    <li>途中の構造を JSON として保存・復元する</li>
  </ul>
</section>
<section class="slide">
  <h2>構成</h2>
  <div class="grid-2">
    <div class="card"><h3>入力</h3><p>PPTX / HTML をドラッグ＆ドロップ</p></div>
    <div class="card"><h3>出力</h3><p>Web 一式 / PPTX / JSON</p></div>
  </div>
  <p>変換処理はローカルで実行し、外部へファイルを送信しない。</p>
</section>
<section class="slide">
  <h2>効果（架空データ）</h2>
  <img src="assets/chart_sample.png" alt="効果のグラフ（架空）">
</section>
<section class="slide">
  <h2>まとめ</h2>
  <p>一度作れば <strong>PowerPoint</strong> と <strong>Web</strong> の両方へ展開できる。</p>
</section>
</main>
</body>
</html>
