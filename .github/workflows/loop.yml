# ループエンジニアリング用 CI: push / PR ごとに pptx-web-bridge/scripts/loop.py と同じ検査を回す。
# Playwright が無い環境では画面検査だけが skip され、単体・API と通し検査は回る。
name: loop-check
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # run: は pptx-web-bridge/ を基準に実行される。actions の with: に書くパスはリポジトリルート基準のまま。
    defaults:
      run:
        working-directory: pptx-web-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pptx-web-bridge/requirements.txt
      - name: 依存導入
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium || echo "Playwright 導入失敗: 画面検査なしで続行"
      - name: ループ検査（全工程）
        run: python scripts/loop.py --no-log
      - name: 成果物を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-outputs
          path: |
            pptx-web-bridge/docs/試験結果.md
          if-no-files-found: ignore
